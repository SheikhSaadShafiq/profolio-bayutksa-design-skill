kenFor(hex) {\n    if (!this._tokMap) {\n      this._tokMap = {\n        \"#F0FAF5\": \"primary/-1\", \"#E9F7F0\": \"primary/0\", \"#D4EFE2\": \"primary/1\", \"#BEE8D3\": \"primary/2\",\n        \"#A9E0C5\": \"primary/3\", \"#93D8B6\": \"primary/4\", \"#7ED0A7\": \"primary/5\", \"#69C899\": \"primary/6\",\n        \"#53C18A\": \"primary/7\", \"#28B16D\": \"primary/8 main\", \"#249F62\": \"primary/9\", \"#208E57\": \"primary/10\",\n        \"#10603A\": \"primary/11 ink\",\n        \"#C88B37\": \"status/warn\", \"#FEF8F0\": \"tint/amber050\", \"#FCEDD9\": \"tint/amber100\",\n        \"#CE2929\": \"status/bad\", \"#F73131\": \"status/bad strong\", \"#FFF2F2\": \"tint/red050\", \"#FFE0E0\": \"tint/red100\",\n        \"#3B84C4\": \"status/info\", \"#F0F7FC\": \"tint/blue050\", \"#F7FCFC\": \"tint/teal050\",\n        \"#222222\": \"text/primary\", \"#4F4F4F\": \"text/secondary\", \"#626262\": \"text/tertiary\",\n        \"#707070\": \"text/muted\", \"#9D9D9D\": \"text/faint\", \"#FFFFFF\": \"surface/card\",\n        \"#DEDEDE\": \"border/strong\", \"#E6E6E6\": \"border/base\", \"#F0F0F0\": \"border/soft\",\n        \"#F5F5F5\": \"surface/grey\", \"#F3F4F5\": \"surface/page\"\n      };\n    }\n    return this._tokMap[hex] || \"\";\n  }\n\n  rlClear() { if (this._hit) { this._hit.classList.remove(\"md-hit\"); this._hit = null; } if (this.state.tip) this.setState({ tip: null }); }\n\n  loadLottie() {\n    if (this._lot) return;\n    if (typeof window === \"undefined\" || !window.LOTTIE_ASSETS) return;\n    this._lot = window.LOTTIE_ASSETS;\n    this.mountLottie();\n    this.forceUpdate();\n  }\n\n  mountLottie() {\n    if (!this._lot || !this._lot.length || !window.lottie) return;\n    this._players = this._players || {};\n    const nodes = document.querySelectorAll(\"[data-lottie]\");\n    for (let i = 0; i < nodes.length; i++) {\n      const el = nodes[i];\n      if (el.getAttribute(\"data-lottie-on\") === \"1\") continue;\n      const id = el.getAttribute(\"data-lottie\");\n      const a = this._lot.filter(x => x.id === id)[0];\n      if (!a) continue;\n      el.setAttribute(\"data-lottie-on\", \"1\");\n      const reduce = window.matchMedia && window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n      const p = window.lottie.loadAnimation({\n        container: el, renderer: \"svg\", loop: a.loop && !reduce, autoplay: false,\n        animationData: JSON.parse(JSON.stringify(a.data)),\n        rendererSettings: { preserveAspectRatio: \"xMidYMid meet\" }\n      });\n      this._players[id] = p;\n      if (reduce) { p.goToAndStop(a.data.op - 1, true); continue; }\n      p.goToAndStop(0, true);\n      if (typeof IntersectionObserver !== \"undefined\") {\n        if (!this._lotObs) {\n          this._lotObs = new IntersectionObserver(ens => {\n            ens.forEach(x => {\n              const pl = this._players[x.target.getAttribute(\"data-lottie\")];\n              if (!pl) return;\n              if (x.isIntersecting) pl.play(); else pl.pause();\n            });\n          }, { threshold: 0.35 });\n        }\n        this._lotObs.observe(el);\n      } else { p.play(); }\n    }\n    if (this._lotTick && document.querySelectorAll(\"[data-lottie]:not([data-lottie-on])\").length === 0) {\n      clearInterval(this._lotTick); this._lotTick = null;\n    }\n  }\n\n  componentDidMount() {\n    this.rlSync();\n    this.loadLottie();\n    this._lotTick = setInterval(() => { this.loadLottie(); this.mountLottie(); }, 320);\n    this._mountT = this.specDefs().map((d, i) => setTimeout(() => {\n      this.setState(s => s.mounted[d.id] ? null : ({ mounted: Object.assign({}, s.mounted, { [d.id]: true }) }));\n    }, 500 + i * 450));\n  }\n  componentDidUpdate() { this.rlSync(); this.mountLottie(); }\n  componentWillUnmount() {\n    if (this._lotTick) clearInterval(this._lotTick);\n    Object.keys(this._players || {}).forEach(k => { try { this._players[k].destroy(); } catch (e) {} });\n    (this._mountT || []).forEach(clearTimeout);\n    document.removeEventListener(\"mousemove\", this._onMove, true);\n    document.body.classList.remove(\"md-rl\");\n    clearTimeout(this._tT);\n  }\n\n  specDefs() {\n    return [\n      { id: \"S1\", anchor: \"sc-card\", label: \"Listing card\", sub: \"Active tab \\u00b7 all performance and quality states\",\n        prose: \"The unit the whole feature is built on. Thumbnail, badge row, price, subtype, location, then the two tiles that carry rank and quality side by side, then the action row. Every state below is the same skeleton with different tile content and tone.\",\n        states: [[\"Good\", \"happy\", \"list\"], [\"High imp, low leads\", \"highImp\", \"list\"], [\"All bad\", \"allBad\", \"list\"], [\"No data yet\", \"noData\", \"list\"], [\"Rank pending\", \"rankPending\", \"list\"], [\"Daily rental\", \"dailyRental\", \"list\"]],\n        tab: \"active\",\n        rows: [\n          [\"Card\", \"360 wide minus 12 side inset \\u00b7 pad 12 \\u00b7 radius 8 \\u00b7 white on #F3F4F5\"],\n          [\"Thumbnail\", \"80 x 80 \\u00b7 radius 6 \\u00b7 photo badge bottom-left, video badge beside it\"],\n          [\"Badge row\", \"gap 4 \\u00b7 chip h 20 \\u00b7 pad 0 6 \\u00b7 radius 4 \\u00b7 10/700 \\u00b7 order Live, Booked, Hot or Signature, discount\", \"prop\"],\n          [\"Price\", \"17/22/700 #222222 \\u00b7 Night suffix 12/400 #707070 with 4 gap\", \"prop\"],\n          [\"Subtype line\", \"12/16/600 #249F62 \\u00b7 directly under price \\u00b7 replaces the old chip\"],\n          [\"Location\", \"12/16/400 #707070 \\u00b7 single line, ellipsis\"],\n          [\"Stat strip\", \"3 columns equal \\u00b7 label 11/500 #9D9D9D over value 14/700 \\u00b7 delta 11/600 tinted by sign\"],\n          [\"Rank tile\", \"1fr \\u00b7 pad 10 \\u00b7 radius 6 \\u00b7 tint by backend tone \\u00b7 value 15/700 \\u00b7 CTA 12/600 green \\u00b7 red tone adds inset shadow 0 0 2 rgba(255,0,0,0.12)\", \"prop\"],\n          [\"Quality tile\", \"1fr \\u00b7 same box \\u00b7 bar h 6 radius 999 \\u00b7 track tint 100, fill tone strong \\u00b7 band: >70 good, 46-70 warn, <=45 bad\", \"prop\"],\n          [\"Action row\", \"h 44 \\u00b7 gap 8 \\u00b7 primary fills, icon buttons 44 x 44\", \"prop\"],\n          [\"Row menu\", \"44 x 44 tap target, glyph 24 \\u00b7 opens bottom sheet, not a popover\"]\n        ],\n        rules: [\n          \"Quality tone is a pure score band: above 70 green, 46 to 70 amber, 45 and below red. The bar fill, the value and the tile tint all take the same band.\",\n          \"Rank tone is NOT a percentile. It is set per listing from the peer comparison the listing is actually losing or winning on, which is why 52nd of 240 reads amber: it sits in the top quarter but the top listing still takes 1.6x its leads. Green means the listing beats the area average, amber means a named peer beats it, red means it is behind on both. The backend supplies the tone with the rank.\",\n          \"Hot and Signature never appear together. Signature is senior: when it is applied, the Hot action is disabled and the Signature upsell is hidden.\",\n          \"A tile never shows a number without the action that changes it. If there is no action, the tile shows the explanation instead.\"\n        ] },\n      { id: \"S2\", anchor: \"sc-filters\", label: \"Filter and sort bar\", sub: \"Single scrolling chip bar above the list\",\n        prose: \"One horizontally scrolling bar carries everything: More Filters with its applied count, Sort, the performance segment, then the individual filter chips. There is no second row of applied chips on mobile: each chip shows its own applied value.\",\n        states: [[\"Default\", \"highImp\", \"list\"], [\"Filter sheet\", \"highImp\", \"filters\"], [\"Sort sheet\", \"highImp\", \"sort\"], [\"Filtering\", \"highImp\", \"skeleton\"]],\n        tab: \"active\",\n        rows: [\n          [\"Bar\", \"h 56 \\u00b7 pad 0 12 \\u00b7 gap 8 \\u00b7 horizontal scroll, no scrollbar, 12 lead and trail inset\"],\n          [\"More Filters chip\", \"44 x 32 \\u00b7 icon only \\u00b7 count badge 16 circle top-right, #F73131 on white ring\", \"prop\"],\n          [\"Sort chip\", \"44 x 32 \\u00b7 icon only \\u00b7 no label, the applied order lives in the sheet\"],\n          [\"Performance segment\", \"3 up \\u00b7 h 32 \\u00b7 radius 999 \\u00b7 selected white on #F0FAF5 with #D4EFE2 ring\"],\n          [\"Value chip\", \"h 32 \\u00b7 pad 0 12 \\u00b7 label swaps to the applied value, truncated at 14 chars with ellipsis, inline x at 24 target\", \"prop\"],\n          [\"Clear filters\", \"12/600 #CE2929 \\u00b7 last item \\u00b7 only present when at least one filter is on\"],\n          [\"Value sheet\", \"bottom sheet, max 70% viewport \\u00b7 single select radio or multi select check \\u00b7 Apply pinned\"],\n          [\"Filtering skeleton\", \"3 cards \\u00b7 1800ms fixed \\u00b7 label \\\"Filtering 65 listings...\\\" 12/500 #707070 centred\"]\n        ],\n        rules: [\n          \"The badge on More Filters counts every applied filter including those set from the chips, so the two never disagree.\",\n          \"Entering or leaving the Ad License Requests tab clears listing filters and swaps the whole chip set. Nothing carries across.\",\n          \"Applying anything, from any surface, runs the same 1800ms skeleton. Sorting runs it too.\"\n        ] },\n      { id: \"S3\", anchor: \"sc-drawer\", label: \"Performance bottom sheet\", sub: \"Opens from the card \\u00b7 trend, peer comparison, quality\",\n        prose: \"The sheet is the detail view. Header repeats the listing identity, then the date range pill, the trend chart with its compare selector, the rank block, and the quality block with the fix list. It is a sheet, not a page: the list stays behind it.\",\n        states: [[\"Good listing\", \"happy\", \"drawer\"], [\"Needs work\", \"highImp\", \"drawer\"], [\"No data yet\", \"noData\", \"drawer\"], [\"Rank pending\", \"rankPending\", \"drawer\"]],\n        tab: \"active\",\n        rows: [\n          [\"Sheet\", \"full width \\u00b7 top radius 20 \\u00b7 max height 92% \\u00b7 shadow 0 -8 32 rgba(0,0,0,0.16)\"],\n          [\"Grabber\", \"36 x 4 \\u00b7 radius 999 \\u00b7 #DEDEDE \\u00b7 8 from top, centred\"],\n          [\"Scrim\", \"rgba(0,0,0,0.42) \\u00b7 fades with the sheet \\u00b7 tap dismisses\"],\n          [\"Header\", \"pad 16 \\u00b7 56 thumb \\u00b7 price, subtype, badge row repeated including the discount tag\"],\n          [\"Date pill\", \"h 32 \\u00b7 pad 0 12 \\u00b7 radius 999 \\u00b7 opens the range sheet: 7, 14, 30, 90 days, this year, since posted\"],\n          [\"Trend chart\", \"h 168 \\u00b7 pad 16 \\u00b7 3 series \\u00b7 own line 2pt solid, peers 1.5pt dashed\"],\n          [\"Compare selector\", \"3 up segment \\u00b7 All / You vs Top / You vs Average\"],\n          [\"Tooltip\", \"tap and hold on the plot \\u00b7 date, three series values, delta line \\u00b7 follows the finger, clamped to the plot\"],\n          [\"Rank block\", \"pad 16 \\u00b7 tinted by tone \\u00b7 rank, peer sentence, CTA full width h 44\"],\n          [\"Quality block\", \"score 28/700 \\u00b7 bar h 8 \\u00b7 fix cards stacked, first expanded only\"],\n          [\"Fix card\", \"pad 14 \\u00b7 radius 8 \\u00b7 numbered \\u00b7 collapsed h 52, expanded auto \\u00b7 action button right\"]\n        ],\n        rules: [\n          \"Only the first fix card is expanded on open. Opening another collapses the previous one.\",\n          \"Applying a fix updates the score, the bar and the rank in place. The sheet never closes to show a result.\",\n          \"Cases with no own data keep the axis and the dashed peer lines, and show \\\"Your line starts tomorrow\\\" over the plot instead of an empty state.\"\n        ] },\n      { id: \"S4\", anchor: \"sc-quality\", label: \"Quality and Improve Quality\", sub: \"Fix list, perfect score, explainer entry\",\n        prose: \"The quality block is the actionable half of the sheet. It lists what is missing, in the order that moves the score most, and every item carries the control that fixes it. When the score is 100 the list is replaced by a single confirmation panel.\",\n        states: [[\"Fix list\", \"allBad\", \"quality\"], [\"Perfect score\", \"happy\", \"quality\"], [\"Explainer\", \"highImp\", \"explainer\"]],\n        tab: \"active\",\n        rows: [\n          [\"Score\", \"28/34/700 tone strong \\u00b7 percent sign 16/600 same colour\"],\n          [\"Bar\", \"h 8 \\u00b7 radius 999 \\u00b7 track tone 100 \\u00b7 fill tone strong \\u00b7 grows once on first view\"],\n          [\"How it's calculated\", \"12/600 #249F62 \\u00b7 44 tap height \\u00b7 opens the explainer sheet\"],\n          [\"Fix card header\", \"index circle 20 \\u00b7 title 13/600 \\u00b7 chevron 20 right\"],\n          [\"Fix card body\", \"12/19/400 #4F4F4F \\u00b7 gap 10 \\u00b7 action button h 40 full width\"],\n          [\"Applied state\", \"check icon replaces index \\u00b7 title strikes to #9D9D9D \\u00b7 card collapses after 420ms\"],\n          [\"Perfect panel\", \"pad 16 \\u00b7 #F0FAF5 \\u00b7 title \\\"Perfect Quality Score\\\" 14/700 #10603A over the maintain sentence\"],\n          [\"Explainer sheet\", \"full height sheet on white \\u00b7 back arrow left, title 18/700 Figtree, close right\"]\n        ],\n        rules: [\n          \"Fixes are ordered by score impact, never alphabetically or by how easy they are.\",\n          \"The explainer is generic for every user: no per-listing numbers, no agent-specific values.\",\n          \"The score shown on the card and the score in the sheet are always the same value. There is one quality number per listing.\"\n        ] },\n      { id: \"S5\", anchor: \"sc-share\", label: \"Share sheet\", sub: \"From the row menu \\u00b7 every listing\",\n        prose: \"A link preview of the listing, the copyable link, then the channel grid. Picking a channel raises a toast and records the channel in the footer line, so the agent can see where a listing has already been pushed.\",\n        states: [[\"Share\", \"happy\", \"share\"], [\"Row menu\", \"happy\", \"menu\"]],\n        tab: \"active\",\n        rows: [\n          [\"Sheet\", \"top radius 20 \\u00b7 pad 16 \\u00b7 content height, not full screen\"],\n          [\"Preview card\", \"64 thumb \\u00b7 price with Night suffix \\u00b7 green subtype line \\u00b7 location\"],\n          [\"Link field\", \"h 44 \\u00b7 read only \\u00b7 mono 12 \\u00b7 bayut.sa/property/details-<bayutId>.html \\u00b7 Copy button inside, right\"],\n          [\"Copied state\", \"button label flips to \\\"Copied\\\" on #E9F7F0 for 2000ms, then reverts\"],\n          [\"Channel grid\", \"3 across \\u00b7 gap 8 \\u00b7 tile h 76 \\u00b7 brand colour glyph over 12/500 label\"],\n          [\"Footer\", \"\\\"Last shared on ...\\\" 12/400 #707070 \\u00b7 Done button h 44 green, full width\"]\n        ],\n        rules: [\n          \"The link is never editable. Copy is the only interaction on that field.\",\n          \"Picking a channel does not close the sheet: the agent may share to more than one.\"\n        ] },\n      { id: \"S6\", anchor: \"sc-tour\", label: \"Onboarding tour\", sub: \"First open \\u00b7 four steps \\u00b7 replayable\",\n        prose: \"A spotlight tour that runs once on first open of the redesigned list. Step one is a full-screen card, steps two to four cut a hole around the real element and morph between them. It can be replayed from the state picker.\",\n        states: [[\"Run tour\", \"highImp\", \"tour\"]],\n        tab: \"active\",\n        rows: [\n          [\"Scrim\", \"rgba(0,0,0,0.62) \\u00b7 cutout radius matches the target plus 4 bleed\"],\n          [\"Card\", \"pad 16 \\u00b7 radius 12 \\u00b7 white \\u00b7 max width 300 \\u00b7 flips above or below the target to stay on screen\"],\n          [\"Title\", \"16/22/700 Figtree #222222\"],\n          [\"Body\", \"13/20/400 #4F4F4F \\u00b7 max 3 lines\"],\n
