  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 opacity: 0.45; transform: scale(0.88); } 50% { opacity: 1; transform: scale(1.12); } }\n  @keyframes mdToast { 0% { opacity: 0; transform: translateY(14px); } 14%, 86% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(8px); } }\n  @keyframes mdSwipe { 0% { transform: translateX(0); } 45% { transform: translateX(26px); } 100% { transform: translateX(0); } }\n  @keyframes mdPress { 0% { transform: scale(1); } 40% { transform: scale(0.965); } 100% { transform: scale(1); } }\n  @keyframes mdSweep { 0% { transform: translateX(-110%); } 100% { transform: translateX(220%); } }\n  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }\n  body.md-rl [data-mock] div, body.md-rl [data-mock] svg, body.md-rl [data-mock] input { outline: 1px dashed rgba(247,49,49,0.28); outline-offset: -1px; }\n  body.md-rl [data-mock] .md-hit { outline: 2px solid #F73131 !important; outline-offset: -2px; }\n<\u002Fstyle>\n<script src=\"79cdb4ba-0938-48ae-9902-17b2b7939096\"><\u002Fscript>\n<script>\nif (!window.LOTTIE_ASSETS) {\n// Real Lottie animations for the Bayut KSA Profolio 2.0 handoff.\n// Authored as Lottie JSON (bodymovin v5) so the deliverables can play them,\n// download them, and ship them as .lottie bundles.\n\nconst GREEN = [0.157, 0.694, 0.427];\nconst DEEP = [0.125, 0.557, 0.341];\nconst AMBER = [0.784, 0.545, 0.216];\nconst RED = [0.969, 0.192, 0.192];\nconst GREY = [0.851, 0.863, 0.882];\nconst LINE = [0.725, 0.761, 0.741];\nconst LINE2 = [0.796, 0.827, 0.808];\nconst TINT = [0.831, 0.937, 0.886];\nconst WHITE = [1, 1, 1];\n\nconst tr = (p, s, r, o) => ({ ty: \"tr\", p: { a: 0, k: p || [0, 0] }, a: { a: 0, k: [0, 0] }, s: { a: 0, k: s || [100, 100] }, r: { a: 0, k: r || 0 }, o: { a: 0, k: o == null ? 100 : o }, sk: { a: 0, k: 0 }, sa: { a: 0, k: 0 }, nm: \"tr\" });\nconst grp = (items, p, s, r, o) => ({ ty: \"gr\", nm: \"g\", np: items.length + 1, it: items.concat([tr(p, s, r, o)]) });\nconst fill = (c, o) => ({ ty: \"fl\", c: { a: 0, k: c.concat([1]) }, o: { a: 0, k: o == null ? 100 : o }, r: 1, nm: \"fill\" });\nconst stroke = (c, w, lc) => ({ ty: \"st\", c: { a: 0, k: c.concat([1]) }, o: { a: 0, k: 100 }, w: { a: 0, k: w }, lc: lc || 2, lj: 2, ml: 1, nm: \"stroke\" });\nconst el = (s, p) => ({ ty: \"el\", p: { a: 0, k: p || [0, 0] }, s: { a: 0, k: s }, d: 1, nm: \"el\" });\nconst rc = (s, p, r) => ({ ty: \"rc\", p: { a: 0, k: p || [0, 0] }, s: { a: 0, k: s }, r: { a: 0, k: r || 0 }, d: 1, nm: \"rc\" });\nconst sh = (v, closed) => ({ ty: \"sh\", ks: { a: 0, k: { i: v.map(() => [0, 0]), o: v.map(() => [0, 0]), v: v, c: !!closed } }, nm: \"sh\" });\nconst trim = (endKf, start) => ({ ty: \"tm\", s: { a: 0, k: start || 0 }, e: endKf, o: { a: 0, k: 0 }, m: 1, nm: \"trim\" });\n\n// pairs: [[frame, [values]], ...]\nconst kf = (pairs) => ({\n  a: 1,\n  k: pairs.map((p, i) => i === pairs.length - 1\n    ? { t: p[0], s: p[1] }\n    : { t: p[0], s: p[1], i: { x: [0.25], y: [1] }, o: { x: [0.35], y: [0] } })\n});\nconst st = (v) => ({ a: 0, k: v });\n\nlet idx = 0;\nconst layer = (nm, shapes, ks, op, ip) => {\n  idx += 1;\n  return {\n    ddd: 0, ind: idx, ty: 4, nm: nm, sr: 1, ao: 0, bm: 0,\n    ks: Object.assign({ o: st(100), r: st(0), p: st([0, 0, 0]), a: st([0, 0, 0]), s: st([100, 100, 100]) }, ks),\n    shapes: shapes, ip: ip || 0, op: op, st: 0\n  };\n};\nconst comp = (nm, w, h, op, layers, fr) => { idx = 0; return { v: \"5.12.2\", fr: fr || 60, ip: 0, op: op, w: w, h: h, nm: nm, ddd: 0, assets: [], layers: layers, markers: [] }; };\n\n/* 01 Rank updating: three green dots breathing in sequence. Loops. */\nfunction rankUpdating() {\n  const dots = [0, 1, 2].map(i => {\n    const t0 = i * 8;\n    return layer(\"dot\" + (i + 1), [grp([el([18, 18]), fill(i === 1 ? DEEP : GREEN)])], {\n      p: st([70 + i * 30, 60, 0]),\n      s: kf([[t0, [62, 62]], [t0 + 18, [132, 132]], [t0 + 40, [62, 62]], [72, [62, 62]]]),\n      o: kf([[t0, [42]], [t0 + 18, [100]], [t0 + 40, [42]], [72, [42]]])\n    }, 72);\n  });\n  const sweep = layer(\"shimmer\", [grp([rc([54, 30], [0, 0], 15), fill(TINT, 55)])], {\n    p: kf([[0, [40, 60]], [72, [176, 60]]]),\n    o: kf([[0, [0]], [14, [70]], [58, [70]], [72, [0]]])\n  }, 72);\n  return comp(\"rank_updating\", 200, 120, 72, [sweep].concat(dots));\n}\n\n/* 02 Quality fill: track ring plus a green ring trimming up to the score. */\nfunction qualityFill() {\n  const track = layer(\"track\", [grp([el([78, 78]), stroke(GREY, 9)])], { p: st([100, 60, 0]) }, 40);\n  const value = layer(\"value\", [grp([el([78, 78]), stroke(GREEN, 9), trim(kf([[0, [0]], [38, [92]]]))])], {\n    p: st([100, 60, 0]), r: st(-90)\n  }, 40);\n  const dot = layer(\"cap\", [grp([el([13, 13]), fill(GREEN)])], {\n    p: st([100, 21, 0]), o: kf([[0, [0]], [8, [100]], [40, [100]]]), s: kf([[0, [40, 40]], [14, [100, 100]], [40, [100, 100]]])\n  }, 40);\n  return comp(\"quality_fill\", 200, 120, 40, [track, value, dot]);\n}\n\n/* 03 Fix applied: disc pops, tick draws, ring radiates out once. */\nfunction fixApplied() {\n  const ring = layer(\"ring\", [grp([el([88, 88]), stroke(GREEN, 5)])], {\n    p: st([100, 60, 0]),\n    s: kf([[4, [80, 80]], [40, [180, 180]]]),\n    o: kf([[4, [70]], [40, [0]]])\n  }, 54, 4);\n  const disc = layer(\"disc\", [grp([el([88, 88]), fill(GREEN)])], {\n    p: st([100, 60, 0]),\n    s: kf([[0, [10, 10]], [16, [108, 108]], [24, [100, 100]], [54, [100, 100]]])\n  }, 54);\n  const tick = layer(\"tick\", [grp([sh([[-17, 2], [-5, 14], [18, -13]]), stroke(WHITE, 8), trim(kf([[10, [0]], [30, [100]]]))])], {\n    p: st([100, 60, 0])\n  }, 54, 10);\n  return comp(\"fix_applied\", 200, 120, 54, [ring, disc, tick]);\n}\n\n/* 04 Rank bars: the explainer banner's three bars, one marked amber. Grows once. */\nfunction rankBars() {\n  const specs = [[62, 42, GREY], [100, 74, AMBER], [138, 56, GREY]];\n  const bars = specs.map((b, i) => {\n    const t0 = i * 6;\n    return layer(\"bar\" + (i + 1), [grp([rc([26, b[1]], [0, -b[1] / 2], 5), fill(b[2])])], {\n      p: st([b[0], 102, 0]),\n      s: kf([[t0, [100, 0]], [t0 + 37, [100, 100]]])\n    }, 50);\n  });\n  const base = layer(\"base\", [grp([rc([120, 3], [0, 0], 1.5), fill(GREY)])], { p: st([100, 104, 0]) }, 50);\n  return comp(\"rank_bars\", 200, 120, 50, bars.concat([base]));\n}\n\n/* 05 No internet: the crossed cloud, stroked line art to match the page icons. Loops. */\nfunction noInternet() {\n  const outline = {\n    ty: \"sh\", nm: \"cloud\",\n    ks: { a: 0, k: {\n      v: [[-44, 16], [-44, 1], [-25, -17], [-6, -13], [10, -30], [38, -5], [44, 16]],\n      i: [[0, 8], [0, 11], [-11, 1], [-5, 5], [-11, -3], [-1, -15], [0, -11]],\n      o: [[0, -8], [-1, -13], [11, -1], [5, -5], [13, 3], [2, 11], [0, 8]],\n      c: true\n    } }\n  };\n  const cloud = layer(\"cloud\", [grp([outline, stroke(LINE, 4.4)])], {\n    p: st([120, 68, 0]), s: st([126, 126, 100]),\n    o: kf([[0, [100]], [60, [70]], [120, [100]]])\n  }, 120);\n  const slash = layer(\"slash\", [grp([sh([[-46, -38], [46, 38]]), stroke(RED, 6.6), trim(kf([[6, [0]], [34, [100]]]))])], {\n    p: st([120, 70, 0]), s: st([126, 126, 100])\n  }, 120, 6);\n  return comp(\"no_internet\", 240, 140, 120, [cloud, slash]);\n}\n\n/* 06 No listings: an empty listing card drifting. Loops. */\nfunction emptyListings() {\n  const card = layer(\"card\", [\n    grp([rc([88, 8], [0, 18], 4), fill(LINE2)]),\n    grp([rc([40, 8], [10, -8], 4), fill(LINE2)]),\n    grp([rc([54, 8], [17, -24], 4), fill(LINE)]),\n    grp([rc([34, 34], [-40, -14], 6), fill(TINT)]),\n    grp([rc([132, 88], [0, 0], 10), fill(WHITE), stroke(LINE, 4)])\n  ], {\n    p: kf([[0, [120, 70, 0]], [36, [120, 63, 0]], [72, [120, 70, 0]], [108, [120, 77, 0]], [144, [120, 70, 0]]])\n  }, 144);\n  const plus = layer(\"plus\", [\n    grp([rc([16, 3.6], [0, 0], 1.8), fill(GREEN)]),\n    grp([rc([3.6, 16], [0, 0], 1.8), fill(GREEN)]),\n    grp([el([36, 36]), stroke(GREEN, 3.4)])\n  ], {\n    p: kf([[0, [206, 110, 0]], [36, [206, 103, 0]], [72, [206, 110, 0]], [108, [206, 117, 0]], [144, [206, 110, 0]]]),\n    s: kf([[0, [100, 100]], [18, [112, 112]], [40, [100, 100]], [144, [100, 100]]])\n  }, 144);\n  return comp(\"empty_listings\", 240, 140, 144, [card, plus]);\n}\n\nconst LOTTIE_ASSETS = [\n  { id: \"rank_updating\", name: \"Rank updating\", where: \"Rank tile, drawer and row, while the new position is fetched\", loop: true, dur: \"1200ms\", easing: \"ease-in-out, loops\", replaces: \"mdSpark / dlSpark\", data: rankUpdating() },\n  { id: \"quality_fill\", name: \"Quality score fill\", where: \"Quality section, once when it first scrolls into view\", loop: false, dur: \"640ms\", easing: \"cubic-bezier(.22,1,.36,1)\", replaces: \"growRight on the score bar\", data: qualityFill() },\n  { id: \"fix_applied\", name: \"Fix applied\", where: \"Fix card, on confirm, before the row collapses\", loop: false, dur: \"900ms\", easing: \"cubic-bezier(.22,1,.36,1)\", replaces: \"popIn on the check mark\", data: fixApplied() },\n  { id: \"rank_bars\", name: \"Rank explainer bars\", where: \"Mobile explainer banner tile, grows once on mount\", loop: false, dur: \"800ms\", easing: \"cubic-bezier(.2,.8,.2,1), 90ms stagger\", replaces: \"growUp x3\", data: rankBars() },\n  { id: \"no_internet\", name: \"No internet\", where: \"List area, both surfaces, while offline\", loop: true, dur: \"2000ms\", easing: \"ease-in-out, loops\", replaces: \"static crossed-cloud SVG\", data: noInternet() },\n  { id: \"empty_listings\", name: \"No listings yet\", where: \"Empty state on every tab, and after a filter returns nothing\", loop: true, dur: \"2400ms\", easing: \"ease-in-out, loops\", replaces: \"static empty-state SVG\", data: emptyListings() }\n];\n\nfunction lottieById(id) {\n  const a = LOTTIE_ASSETS.filter(x => x.id === id)[0];\n  return a ? a.data : null;\n}\n\nfunction dotLottieManifest() {\n  return {\n    version: \"1.0\",\n    generator: \"bayut-profolio-handoff\",\n    animations: LOTTIE_ASSETS.map(a => ({ id: a.id, loop: a.loop, speed: 1, autoplay: true, direction: 1, mode: \"forward\" }))\n  };\n}\n\nif (typeof window !== \"undefined\") {\n  window.LOTTIE_ASSETS = LOTTIE_ASSETS;\n  window.lottieById = lottieById;\n  window.dotLottieManifest = dotLottieManifest;\n}\n\n}\n<\u002Fscript>\n<\u002Fhelmet>\n<template id=\"__bundler_thumbnail\">\n<svg sc-camel-view-box=\"0 0 120 120\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"120\" height=\"120\" rx=\"18\" fill=\"#123A4A\"><\u002Frect><text x=\"60\" y=\"76\" font-family=\"Figtree, sans-serif\" font-size=\"46\" font-weight=\"800\" fill=\"#8ED7F0\" text-anchor=\"middle\">MD<\u002Ftext><\u002Fsvg>\n<\u002Ftemplate>\n\n<div style=\"min-height: 100vh; background: #F3F4F5\">\n\n  <sc-if value=\"{{ tipOn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; left: {{ tipX }}; top: {{ tipY }}; z-index: 90; pointer-events: none; min-width: 268px; max-width: 320px; padding: 12px 14px; background: #16181C; border-radius: 10px; box-shadow: 0 18px 44px rgba(0,0,0,0.34); display: flex; flex-direction: column; gap: 7px\">\n      <div style=\"display: flex; align-items: baseline; gap: 7px\">\n        <div style=\"color: #7ED0A7; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700\">{{ tipName }}<\u002Fdiv>\n        <div style=\"color: #6B7280; font-family: 'JetBrains Mono', monospace; font-size: 11px\">{{ tipTag }}<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-for list=\"{{ tipRows }}\" as=\"tr\" hint-placeholder-count=\"9\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 18px\">\n          <div style=\"color: #8A9099; font-family: 'JetBrains Mono', monospace; font-size: 11px\">{{ tr.k }}<\u002Fdiv>\n          <div style=\"color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 11px; text-align: right\">{{ tr.v }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <main style=\"max-width: 1180px; margin: 0 auto; padding: 28px 24px 100px 24px; display: flex; flex-direction: column; gap: 22px\">\n\n    <section id=\"s00\" style=\"padding: 26px 28px; background: white; border-radius: 12px; outline: 1px #EDEDED solid; outline-offset: -1px; display: flex; flex-direction: column; gap: 20px\">\n      <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap\">\n        <div style=\"min-width: 0; display: flex; flex-direction: column; gap: 8px\">\n          <div style=\"display: flex; align-items: center; gap: 8px\">\n            <div style=\"padding: 3px 8px; background: #E9F7F0; border-radius: 4px; color: #208E57; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">MOBILE HANDOFF<\u002Fdiv>\n            <div style=\"padding: 3px 8px; background: #F0F7FC; border-radius: 4px; color: #3B84C4; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">iOS · ANDROID · MWEB<\u002Fdiv>\n            <div style=\"padding: 3px 8px; background: #F5F5F5; border-radius: 4px; color: #707070; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">v2.0 · FINAL<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"color: #222222; font-family: Figtree, sans-serif; font-size: 30px; font-weight: 800; line-height: 36px\">My Listings, Performance &amp; Quality<\u002Fdiv>\n          <div style=\"color: #626262; font-size: 13px; font-weight: 300\">Bayut KSA Profolio 2.0 · mobile web and app · 360pt base<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 8px\">\n          <div sc-camel-on-click=\"{{ toggleRedline }}\" style=\"position: fixed; right: 24px; bottom: 24px; z-index: 80; height: 40px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; gap: 7px; cursor: pointer; background: {{ rlBg }}; outline: 1px {{ rlBorder }} solid; outline-offset: -1px; box-shadow: 0 10px 28px rgba(23,26,31,0.16); color: {{ rlInk }}; font-size: 12px; font-weight: 600\">{{ rlLabel }}<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ downloadTokens }}\" style=\"height: 36px; padding: 0 14px; border-radius: 8px; display: flex; align-items: center; cursor: pointer; background: #28B16D; color: white; font-size: 12px; font-weight: 600\" style-hover=\"background: #208E57\">Download tokens.json<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding: 18px 20px; background: #F7FCFC; border-radius: 10px; display: flex; flex-direction: column; gap: 10px\">\n        <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.6px\">00 · SUMMARY<\u002Fdiv>\n        <div style=\"max-width: 860px; color: #222222; font-size: 15px; line-height: 25px; text-wrap: pretty\">The agent opens My Listings and sees, on every card, how that listing ranks against similar ones nearby and what its quality score is missing. Tapping the card opens a bottom sheet with the full performance trend, the peer comparison, and a fix list that can be worked through in one pass; every fix that is applied recalculates the score and the rank in place.<\u002Fdiv>\n        <div style=\"display: flex; align-items: flex-start; gap: 9px; padding-top: 2px\">\n          <div style=\"flex: none; margin-top: 1px; padding: 2px 7px; background: #E9F7F0; border-radius: 4px; color: #208E57; font-size: 10px; font-weight: 700\">RULE<\u002Fdiv>\n          <div style=\"min-width: 0; color: #4F7B7D; font-size: 13px; line-height: 21px; text-wrap: pretty\">Rank and quality are always shown together and always with the action that changes them. No number appears in this feature without a route to improving it.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 8px\">\n        <sc-for list=\"{{ facts }}\" as=\"f\" hint-placeholder-count=\"5\">\n          <div style=\"padding: 12px 14px; background: #FAFAFA; border-radius: 8px; display: flex; flex-direction: column; gap: 3px\">\n            <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">{{ f.k }}<\u002Fdiv>\n            <div style=\"color: #222222; font-size: 14px; font-weight: 600\">{{ f.v }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"s01\" style=\"padding: 22px 24px; background: white; border-radius: 12px; outline: 1px #EDEDED solid; outline-offset: -1px; display: flex; flex-direction: column; gap: 14px\">\n      <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.6px\">01 · CONTENTS<\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px\">\n        <sc-for list=\"{{ toc }}\" as=\"t\" hint-placeholder-count=\"12\">\n          <a href=\"{{ t.href }}\" style=\"padding: 11px 13px; background: #FAFAFA; border-radius: 8px; display: flex; align-items: center; gap: 10px\" style-hover=\"background: #F0FAF5\">\n            <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600\">{{ t.num }}<\u002Fdiv>\n            <div style=\"min-width: 0; color: #222222; font-size: 13px; font-weight: 500\">{{ t.label }}<\u002Fdiv>\n          <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"s02\" style=\"padding: 22px 24px; background: white; border-radius: 12px; outline: 1px #EDEDED solid; outline-offset: -1px; display: flex; flex-direction: column; gap: 16px\">\n      <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap\">\n        <div style=\"display: flex; flex-direction: column; gap: 3px\">\n          <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.6px\">02 · INTERACTIVE PROTOTYPE<\u002Fdiv>\n          <div style=\"color: #626262; font-size: 12px; font-weight: 300\">The real build, not a mock. Pick a scenario to jump straight into a state, then keep tapping.<\u002Fdiv>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ resetProto }}\" style=\"height: 32px; padding: 0 13px; border-radius: 8px; display: flex; align-items: center; cursor: pointer; background: #F5F5F5; color: #4F4F4F; font-size: 12px; font-weight: 600\" style-hover=\"background: #EDEDED\">Reset<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n        <div style=\"flex: 1 1 260px; min-width: 0; max-width: 320px; display: flex; flex-direction: column; gap: 14px\">\n          <sc-for list=\"{{ scenarioGroups }}\" as=\"g\" hint-placeholder-count=\"4\">\n            <div style=\"display: flex; flex-direction: column; gap: 7px\">\n              <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">{{ g.title }}<\u002Fdiv>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n                <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"5\">\n                  <div sc-camel-on-click=\"{{ it.pick }}\" style=\"height: 30px; padding: 0 12px; border-radius: 999px; display: flex; align-items: center; cursor: pointer; background: {{ it.bg }}; outline: 1px {{ it.border }} solid; outline-offset: -1px; color: {{ it.ink }}; font-size: 12px; font-weight: {{ it.weight }}\">{{ it.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"padding: 12px 14px; background: #FAFAFA; border-radius: 8px; display: flex; flex-direction: column; gap: 5px\">\n            <div style=\"color: #9D9D9D; font-size: 10px }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"max-width: 900px; color: #4F4F4F; font-size: 13px; line-height: 21px; text-wrap: pretty\">{{ sp.prose }}<\u002Fdiv>\n\n          <div style=\"display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start\">\n            <div style=\"flex: 1 1 380px; min-width: 0; order: 2; display: flex; flex-direction: column; gap: 12px\">\n              <div style=\"border-radius: 8px; outline: 1px #F0F0F0 solid; outline-offset: -1px; overflow: hidden\">\n                <div style=\"padding: 9px 12px; background: #FAFAFA; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; border-bottom: 1px #F0F0F0 solid\">\n                  <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">ELEMENT<\u002Fdiv>\n                  <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">SPEC<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ sp.rows }}\" as=\"row\" hint-placeholder-count=\"7\">\n                  <div style=\"padding: 9px 12px; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; border-bottom: 1px #F7F7F7 solid; align-items: baseline\">\n                    <div style=\"color: #222222; font-size: 12px; font-weight: 500\">{{ row.el }}<\u002Fdiv>\n                    <div style=\"display: flex; align-items: baseline; gap: 6px\">\n                      <sc-if value=\"{{ row.hasBadge }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"flex: none; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; background: {{ row.badgeBg }}; color: {{ row.badgeInk }}\">{{ row.badge }}<\u002Fdiv>\n                      <\u002Fsc-if>\n                      <div style=\"min-width: 0; color: #4F4F4F; font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 18px\">{{ row.spec }}<\u002Fdiv>\n                    <\u002Fdiv>       <sc-if value=\"{{ sp.mounted }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div data-mock=\"{{ sp.id }}\" style=\"position: absolute; left: 0; top: 0; width: 528px; height: 864px; transform: scale(0.7576); transform-origin: 0 0\">\n                    <dc-import name=\"My Listing Mobileweb\" solo-phone=\"{{ true }}\" no-auto-tour=\"{{ true }}\" init-tab=\"{{ sp.initTab }}\" init-case=\"{{ sp.initCase }}\" init-view=\"{{ sp.initView }}\" scenario-nonce=\"{{ sp.nonce }}\" hint-size=\"528px,864px\"><\u002Fdc-import>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ sp.notMounted }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div sc-camel-on-click=\"{{ sp.mount }}\" style=\"position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer\">\n                    <div style=\"height: 38px; padding: 0 18px; background: white; border-radius: 999px; outline: 1px #E6E6E6 solid; outline-offset: -1px; display: flex; align-items: center; color: #4F4F4F; font-size: 13px; font-weight: 600\">Load screen {{ sp.id }}<\u002Fdiv>\n                    <div style=\"color: #9D9D9D; font-size: 11px; font-weight: 300\">Renders the real build at this state<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ redline }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"position: absolute; left: 10px; top: 10px; z-index: 3; display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px; background: #16181C; border-radius: 6px; pointer-events: none\">\n                    <div style=\"color: #7ED0A7; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700\">INSPECT<\u002Fdiv>\n                    <div style=\"color: #8A9099; font-family: 'JetBrains Mono', monospace; font-size: 10px\">hover any element<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsection>\n\n    <section id=\"s04\" style=\"padding: 22px 24px; background: white; border-radius: 12px; outline: 1px #EDEDED solid; outline-offset: -1px; display: flex; flex-direction: column; gap: 16px\">\n      <div style=\"display: flex; flex-direction: column; gap: 3px\">\n        <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.6px\">04 · RULES<\u002Fdiv>\n        <div style=\"color: #626262; font-size: 12px; font-weight: 300\">The decisions that are not visible in a frame. Break one and the feature stops making sense.<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-for list=\"{{ ruleGroups }}\" as=\"rg\" hint-placeholder-count=\"5\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px\">\n          <div style=\"color: #222222; font-size: 13px; font-weight: 700\">{{ rg.title }}<\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 8px\">\n            <div style=\"padding: 14px 16px; background: #F0FAF5; border-radius: 10px; display: flex; flex-direction: column; gap: 8px\">\n              <div style=\"display: flex; align-items: center; gap: 7px\">\n                <div style=\"width: 16px; height: 16px; background: #28B16D; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: white; font-size: 10px; font-weight: 700\">✓<\u002Fdiv>\n                <div style=\"color: #10603A; font-size: 11px; font-weight: 700; letter-spacing: 0.4px\">DO<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ rg.dos }}\" as=\"d\" hint-placeholder-count=\"3\">\n                <div style=\"color: #10603A; font-size: 12px; line-height: 19px; text-wrap: pretty\">{{ d.text }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"padding: 14px 16px; background: #FFF8F8; border-radius: 10px; display: flex; flex-direction: column; gap: 8px\">\n              <div style=\"display: flex; align-items: center; gap: 7px\">\n                <div style=\"width: 16px; height: 16px; background: #F73131; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: white; font-size: 10px; font-weight: 700\">✕<\u002Fdiv>\n                <div style=\"color: #CE2929; font-size: 11px; font-weight: 700; letter-spacing: 0.4px\">DON'T<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ rg.donts }}\" as=\"d\" hint-placeholder-count=\"3\">\n                <div style=\"color: #8A3030; font-size: 12px; line-height: 19px; text-wrap: pretty\">{{ d.text }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsection>\n\n    <section id=\"s05\" style=\"padding: 22px 24px; background: white; border-radius: 12px; outline: 1px #EDEDED solid; outline-offset: -1px; display: flex; flex-direction: column; gap: 16px\">\n      <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap\">\n        <div style=\"display: flex; flex-direction: column; gap: 3px\">\n          <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.6px\">05 · INTERACTION &amp; MOTION<\u002Fdiv>\n          <div style=\"color: #626262; font-size: 12px; font-weight: 300\">Every row replays the real timing. Six of them ship as finished .lottie files, in 05b below.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 8px\">\n          <div sc-camel-on-click=\"{{ replayAll }}\" style=\"height: 32px; padding: 0 13px; border-radius: 8px; display: flex; align-items: center; cursor: pointer; background: #F0FAF5; color: #249F62; font-size: 12px; font-weight: 600\" style-hover=\"background: #D4EFE2\">Replay all<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ downloadAllLottie }}\" style=\"height: 32px; padding: 0 13px; border-radius: 8px; display: flex; align-items: center; cursor: pointer; background: #28B16D; color: white; font-size: 12px; font-weight: 600\" style-hover=\"background: #208E57\">Download all .json<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-for list=\"{{ motions }}\" as=\"mo\" hint-placeholder-count=\"10\">\n        <div style=\"padding: 14px; background: #FAFAFA; border-radius: 10px; display: grid; grid-template-columns: 46px 1fr 150px 106px 96px; gap: 12px; align-items: center\">\n          <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600\">{{ mo.num }}<\u002Fdiv>\n          <div style=\"min-width: 0; display: flex; flex-direction: column; gap: 3px\">\n            <div style=\"color: #222222; font-size: 13px; font-weight: 600\">{{ mo.trigger }}<\u002Fdiv>\n            <div style=\"color: #626262; font-size: 11px; line-height: 16px; text-wrap: pretty\">{{ mo.what }}<\u002Fdiv>\n            <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-top: 2px\">\n              <div style=\"padding: 1px 6px; background: white; border-radius: 4px; outline: 1px #EDEDED solid; outline-offset: -1px; color: #4F4F4F; font-family: 'JetBrains Mono', monospace; font-size: 10px\">{{ mo.dur }}<\u002Fdiv>\n              <div style=\"padding: 1px 6px; background: white; border-radius: 4px; outline: 1px #EDEDED solid; outline-offset: -1px; color: #4F4F4F; font-family: 'JetBrains Mono', monospace; font-size: 10px\">{{ mo.easing }}<\u002Fdiv>\n              <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 300\">{{ mo.notes }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height: 56px; background: white; border-radius: 8px; outline: 1px #EDEDED solid; outline-offset: -1px; display: flex; align-items: center; justify-content: center; overflow: hidden\">\n            <div style=\"animation: {{ mo.anim }}\">{{ mo.demo }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ mo.replay }}\" style=\"height: 32px; border-radius: 8px; background: #F0FAF5; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; color: #249F62; font-size: 12px; font-weight: 600\" style-hover=\"background: #D4EFE2\">\n            <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\"><path d=\"M13.4 8a5.4 5.4 0 1 1-1.6-3.8\" stroke=\"#249F62\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M13.6 1.8v3.2h-3.2\" stroke=\"#249F62\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <div>Replay<\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ mo.lottie }}\" style=\"height: 32px; border-radius: 8px; background: white; outline: 1px #E6E6E6 solid; outline-offset: -1px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #4F4F4F; font-size: 11px; font-weight: 600\" style-hover=\"background: #F5F5F5\">.json<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n\n      <div style=\"padding: 12px 14px; background: #FEF8F0; border-radius: 8px; display: flex; align-items: flex-start; gap: 10px\">\n        <div style=\"flex: none; padding: 1px 6px; background: #FCEDD9; border-radius: 4px; color: #C88B37; font-size: 10px; font-weight: 700\">TIMING<\u002Fdiv>\n        <div style=\"min-width: 0; color: #7A5A2E; font-size: 12px; line-height: 18px; text-wrap: pretty\">The per-row .json is a timing stub: correct frame rate, in and out points and easing, one placeholder shape, so the pipeline can be wired before the art lands. Six of these moments are already finished animations, in 05b below. The rest are one or two properties moving and should be implemented natively.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-direction: column; gap: 10px\">\n        <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap\">\n          <div style=\"display: flex; flex-direction: column; gap: 3px\">\n            <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.6px\">05b · DOTLOTTIE<\u002Fdiv>\n            <div style=\"color: #626262; font-size: 12px; font-weight: 300\">Finished files, shared with web so both surfaces animate identically. Each tile plays the real animation data.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 8px\">\n            <div sc-camel-on-click=\"{{ replayLotties }}\" style=\"height: 32px; padding: 0 13px; border-radius: 8px; background: #F0FAF5; color: #249F62; font-size: 12px; font-weight: 600; display: flex; align-items: center; cursor: pointer\" style-hover=\"background: #D4EFE2\">Replay all<\u002Fdiv>\n            <a href=\"design_handoff_listing_performance/lottie/bayut_profolio_motion.lottie\" download=\"bayut_profolio_motion.lottie\" style=\"height: 32px; padding: 0 13px; border-radius: 8px; background: #28B16D; color: white; font-size: 12px; font-weight: 600; display: flex; align-items: center\">Download all .lottie<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(272px, 1fr)); gap: 8px\">\n          <sc-for list=\"{{ lotties }}\" as=\"lt\" hint-placeholder-count=\"6\">\n            <div style=\"padding: 12px; background: #FAFAFA; border-radius: 10px; display: flex; flex-direction: column; gap: 10px\">\n              <div data-lottie=\"{{ lt.id }}\" style=\"height: 108px; background: white; border-radius: 8px; outline: 1px #EDEDED solid; outline-offset: -1px\"><\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 10px\">\n                  <div style=\"color: #222222; font-size: 13px; font-weight: 600\">{{ lt.name }}<\u002Fdiv>\n                  <div style=\"padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; background: {{ lt.loopBg }}; color: {{ lt.loopInk }}\">{{ lt.loopLabel }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"color: #626262; font-size: 11px; line-height: 16px; text-wrap: pretty\">{{ lt.where }}<\u002Fdiv>\n                <div style=\"display: flex; flex-wrap: wrap; gap: 6px; padding-top: 2px\">\n                  <div style=\"padding: 1px 6px; background: white; border-radius: 4px; outline: 1px #EDEDED solid; outline-offset: -1px; color: #4F4F4F; font-family: 'JetBrains Mono', monospace; font-size: 10px\">{{ lt.dur }}<\u002Fdiv>\n                  <div style=\"padding: 1px 6px; background: white; border-radius: 4px; outline: 1px #EDEDED solid; outline-offset: -1px; color: #4F4F4F; font-family: 'JetBrains Mono', monospace; font-size: 10px\">{{ lt.size }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding-top: 2px\">{{ lt.file }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 6px\">\n                <div sc-camel-on-click=\"{{ lt.replay }}\" style=\"flex: 1; height: 30px; border-radius: 7px; background: #F0FAF5; color: #249F62; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer\" style-hover=\"background: #D4EFE2\">Replay<\u002Fdiv>\n                <a href=\"{{ lt.lottieHref }}\" download=\"\" style=\"flex: 1; height: 30px; border-radius: 7px; background: white; outline: 1px #E6E6E6 solid; outline-offset: -1px; color: #4F4F4F; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center\">.lottie<\u002Fa>\n                <a href=\"{{ lt.jsonHref }}\" download=\"\" style=\"flex: 1; height: 30px; border-radius: 7px; background: white; outline: 1px #E6E6E6 solid; outline-offset: -1px; color: #4F4F4F; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center\">.json<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"padding: 12px 14px; background: #F0FAF5; border-radius: 8px; display: flex; align-items: flex-start; gap: 10px\">\n          <div style=\"flex: none; padding: 1px 6px; background: #D4EFE2; border-radius: 4px; color: #208E57; font-size: 10px; font-weight: 700\">USE<\u002Fdiv>\n          <div style=\"min-width: 0; color: #2F4F41; font-size: 12px; line-height: 18px; text-wrap: pretty\">60fps, brand palette baked in, no text layers, so the same file works in EN and AR. iOS takes them through dotlottie-ios, Android through dotlottie-android, mweb through dotlottie-web. Loop files run until their state ends; one-shot files play once on the trigger and hold the last frame. Under Reduce Motion do not mount the player: render the last frame as a still.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"s06\" style=\"padding: 22px 24px; background: white; border-radius: 12px; outline: 1px #EDEDED solid; outline-offset: -1px; display: flex; flex-direction: column; gap: 14px\">\n      <div style=\"display: flex; flex-direction: column; gap: 3px\">\n        <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.6px\">06 · GESTURES &amp; BEHAVIOURS<\u002Fdiv>\n        <div style=\"color: #626262; font-size: 12px; font-weight: 300\">Touch only. Where two gestures compete, the winner is named.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-radius: 8px; outline: 1px #F0F0F0 solid; outline-offset: -1px; overflow: hidden\">\n        <div style=\"padding: 9px 12px; background: #FAFAFA; display: grid; grid-template-columns: 190px 1.4fr 1fr 120px; gap: 12px; border-bottom: 1px #F0F0F0 solid\">\n          <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">GESTURE<\u002Fdiv>\n          <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">BEHAVIOUR<\u002Fdiv>\n          <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">CONFLICT / RESOLUTION<\u002Fdiv>\n          <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">PLATFORM<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ gestures }}\" as=\"g\" hint-placeholder-count=\"10\">\n          <div style=\"padding: 10px 12px; display: grid; grid-template-columns: 190px 1.4fr 1fr 120px; gap: 12px; border-bottom: 1px #F7F7F7 solid; align-items: baseline\">\n            <div style=\"color: #222222; font-size: 12px; font-weight: 500\">{{ g.name }}<\u002Fdiv>\n            <div style=\"color: #4F4F4F; font-size: 12px; line-height: 18px; text-wrap: pretty\">{{ g.behaviour }}<\u002Fdiv>\n            <div style=\"color: #707070; font-size: 12px; line-height: 18px; text-wrap: pretty\">{{ g.conflict }}<\u002Fdiv>\n            <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 11px\">{{ g.platform }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"s07\" style=\"padding: 22px 24px; background: white; border-radius: 12px; outline: 1px #EDEDED solid; outline-offset: -1px; display: flex; flex-direction: column; gap: 14px\">\n      <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap\">\n        <div style=\"display: flex; flex-direction: column; gap: 3px\">\n          <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.6px\">07 · EDGE CASES &amp; ERROR STATES<\u002Fdiv>\n          <div style=\"color: #626262; font-size: 12px; font-weight: 300\">Unresolved rows are flagged, never dropped.<\u002Fdiv>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ toggleUnresolved }}\" style=\"height: 32px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; cursor: pointer; background: {{ unBg }}; outline: 1px {{ unBorder }} solid; outline-offset: -1px; color: {{ unInk }}; font-size: 12px; font-weight: 600\">{{ unLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-radius: 8px; outline: 1px #F0F0F0 solid; outline-offset: -1px; overflow: hidden\">\n        <div style=\"padding: 9px 12px; background: #FAFAFA; display: grid; grid-template-columns: 46px 1.05fr 1.4fr 1.05fr; gap: 12px; border-bottom: 1px #F0F0F0 solid\">\n          <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">#<\u002Fdiv>\n          <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">CASE<\u002Fdiv>\n          <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">EXPECTED BEHAVIOUR<\u002Fdiv>\n          <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">COPY<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ edges }}\" as=\"e\" hint-placeholder-count=\"14\">\n          <div style=\"padding: 10px 12px; display: {{ e.display }}; grid-template-columns: 46px 1.05fr 1.4fr 1.05fr; gap: 12px; border-bottom: 1px #F7F7F7 solid; align-items: baseline; background: {{ e.bg }}\">\n            <div style=\"display: flex; align-items: center; gap: 5px\">\n              <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 11px\">{{ e.num }}<\u002Fdiv>\n              <sc-if value=\"{{ e.open }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"width: 6px; height: 6px; background: #F73131; border-radius: 999px\"><\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"color: #222222; font-size: 12px; font-weight: 500; line-height: 18px; text-wrap: pretty\">{{ e.case }}<\u002Fdiv>\n            <div style=\"color: #4F4F4F; font-size: 12px; line-height: 18px; text-wrap: pretty\">{{ e.behaviour }}<\u002Fdiv>\n            <div style=\"color: #707070; font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 18px; text-wrap: pretty\">{{ e.copy }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"s08\" style=\"padding: 22px 24px; background: white; border-radius: 12px; outline: 1px #EDEDED solid; outline-offset: -1px; display: flex; flex-direction: column; gap: 16px\">\n      <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap\">\n        <div style=\"display: flex; flex-direction: column; gap: 3px\">\n          <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.6px\">08 · ASSETS<\u002Fdiv>\n          <div style=\"color: #626262; font-size: 12px; font-weight: 300\">Real files, generated in the browser. SVG is the source. PNG and JPEG are rasterised from it at the density you pick.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 8px\">\n          <sc-for list=\"{{ densities }}\" as=\"d\" hint-placeholder-count=\"3\">\n            <div sc-camel-on-click=\"{{ d.pick }}\" style=\"height: 30px; padding: 0 12px; border-radius: 999px; display: flex; align-items: center; cursor: pointer; background: {{ d.bg }}; outline: 1px {{ d.border }} solid; outline-offset: -1px; color: {{ d.ink }}; font-size: 12px; font-weight: {{ d.weight }}\">{{ d.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n          <div sc-camel-on-click=\"{{ downloadAllIcons }}\" style=\"height: 30px; padding: 0 13px; border-radius: 8px; display: flex; align-items: center; cursor: pointer; background: #28B16D; color: white; font-size: 12px; font-weight: 600\" style-hover=\"background: #208E57\">{{ dlAllLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 8px\">\n        <sc-for list=\"{{ icons }}\" as=\"ic\" hint-placeholder-count=\"24\">\n          <div style=\"padding: 13px 12px; background: #FAFAFA; border-radius: 8px; display: flex; flex-direction: column; align-items: center; gap: 9px\">\n            <div style=\"height: 34px; display: flex; align-items: center; justify-content: center\">{{ ic.node }}<\u002Fdiv>\n            <div style=\"text-align: center; color: #222222; font-family: 'JetBrains Mono', monospace; font-size: 10px\">{{ ic.name }}<\u002Fdiv>\n            <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 300\">{{ ic.meta }}<\u002Fdiv>\n            <div style=\"width: 100%; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px\">\n              <div sc-camel-on-click=\"{{ ic.svg }}\" style=\"height: 26px; border-radius: 6px; background: white; outline: 1px #E6E6E6 solid; outline-offset: -1px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #4F4F4F; font-size: 10px; font-weight: 600\" style-hover=\"background: #F0FAF5\">SVG<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ ic.png }}\" style=\"height: 26px; border-radius: 6px; background: white; outline: 1px #E6E6E6 solid; outline-offset: -1px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #4F4F4F; font-size: 10px; font-weight: 600\" style-hover=\"background: #F0FAF5\">PNG<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ ic.jpg }}\" style=\"height: 26px; border-radius: 6px; background: white; outline: 1px #E6E6E6 solid; outline-offset: -1px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #4F4F4F; font-size: 10px; font-weight: 600\" style-hover=\"background: #F0FAF5\">JPG<\u002Fdiv>\n            <\u002Fdiv>\n            <div sc-camel-on-click=\"{{ ic.copy }}\" style=\"color: {{ ic.copyInk }}; font-size: 10px; font-weight: 600; cursor: pointer\">{{ ic.copyLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 8px\">\n        <div style=\"padding: 14px 16px; background: #FAFAFA; border-radius: 10px; display: flex; flex-direction: column; gap: 6px\">\n          <div style=\"color: #222222; font-size: 12px; font-weight: 700\">Naming and folders<\u002Fdiv>\n          <div style=\"color: #4F4F4F; font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 19px\">ios/&nbsp;&nbsp;ic_rank.imageset/ic_rank@1x.png @2x @3x<br>android/&nbsp;&nbsp;res/drawable-mdpi..xxxhdpi/ic_rank.png<br>android/&nbsp;&nbsp;res/drawable/ic_rank.xml (vector, preferred)<br>mweb/&nbsp;&nbsp;icons/ic-rank.svg (inline, currentColor)<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 14px 16px; background: #FFF8F8; border-radius: 10px; outline: 1px #FFE0E0 solid; outline-offset: -1px; display: flex; flex-direction: column; gap: 5px\">\n          <div style=\"color: #CE2929; font-size: 12px; font-weight: 700\">No production imagery in this delivery<\u002Fdiv>\n          <div style=\"color: #4F4F4F; font-size: 12px; line-height: 19px; text-wrap: pretty\">Every thumbnail is a striped CSS placeholder: repeating-linear-gradient(135deg, #EDEDED 0 6px, #F6F6F6 6px 12px). Real listing photography comes from the listings API and must be requested at 2x the rendered box, 80x80pt on the card and 56x56pt in the sheet header. A listing with no photos, and a photo that fails to load, both fall back to a #F5F5F5 box with a camera-slash glyph and the words No photos: specified in edge case 17, not drawn in the build yet.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"s09\" style=\"padding: 22px 24px; background: white; border-radius: 12px; outline: 1px #EDEDED solid; outline-offset: -1px; display: flex; flex-direction: column; gap: 16px\">\n      <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap\">\n        <div style=\"display: flex; flex-direction: column; gap: 3px\">\n          <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.6px\">09 · TOKENS<\u002Fdiv>\n          <div style=\"color: #626262; font-size: 12px; font-weight: 300\">One JSON file. Click any swatch to copy its hex.<\u002Fdiv>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ downloadTokens }}\" style=\"height: 32px; padding: 0 13px; border-radius: 8px; display: flex; align-items: center; cursor: pointer; background: #28B16D; color: white; font-size: 12px; font-weight: 600\" style-hover=\"background: #208E57\">Download tokens.json<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 9px\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap\">\n          <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">CONSUMER PRIMARY (BAYUT SCALE)<\u002Fdiv>\n          <div style=\"color: #626262; font-size: 12px; font-weight: 300\">Every green in both surfaces now comes from this ramp. Steps 10 and 11 extend it for pressed states and ink on tints.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px\">\n          <sc-for list=\"{{ primaryRamp }}\" as=\"p\" hint-placeholder-count=\"12\">\n            <div sc-camel-on-click=\"{{ p.copy }}\" style=\"border-radius: 8px; overflow: hidden; outline: 1px #EDEDED solid; outline-offset: -1px; cursor: pointer; display: flex; flex-direction: column\">\n              <div style=\"height: 54px; background: {{ p.hex }}\"><\u002Fdiv>\n              <div style=\"padding: 8px 9px 9px 9px; background: #FAFAFA; display: flex; flex-direction: column; gap: 2px\">\n                <div style=\"color: #222222; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700\">{{ p.step }}<\u002Fdiv>\n                <div style=\"color: #4F4F4F; font-family: 'JetBrains Mono', monospace; font-size: 10px\">{{ p.hex }}<\u002Fdiv>\n                <div style=\"color: #9D9D9D; font-size: 10px; line-height: 14px; text-wrap: pretty\">{{ p.use }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-for list=\"{{ tokenGroups }}\" as=\"tg\" hint-placeholder-count=\"4\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px\">\n          <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">{{ tg.title }}<\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 6px\">\n            <sc-for list=\"{{ tg.items }}\" as=\"tk\" hint-placeholder-count=\"8\">\n              <div sc-camel-on-click=\"{{ tk.copy }}\" style=\"padding: 9px 10px; background: #FAFAFA; border-radius: 8px; display: flex; align-items: center; gap: 9px; cursor: pointer\" style-hover=\"background: #F0FAF5\">\n                <div style=\"width: 22px; height: 22px; flex: none; border-radius: 5px; background: {{ tk.swatch }}; outline: 1px rgba(0,0,0,0.08) solid; outline-offset: -1px\"><\u002Fdiv>\n                <div style=\"min-width: 0; display: flex; flex-direction: column; gap: 1px\">\n                  <div style=\"color: #222222; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600\">{{ tk.name }}<\u002Fdiv>\n                  <div style=\"color: #9D9D9D; font-family:
