document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nsform: scale(1.04); } 100% { opacity: 1; transform: scale(1); } }\n  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }\n  body.rl-on [data-mock-id] div, body.rl-on [data-mock-id] svg, body.rl-on [data-mock-id] input { outline: 1px dashed rgba(247,49,49,0.30); outline-offset: -1px; }\n  body.rl-on [data-mock-id] .rl-hit { outline: 2px solid #F73131 !important; outline-offset: -2px; }\n<\u002Fstyle>\n<script src=\"168068bc-c7c5-406d-8f49-bcd6684c123b\"><\u002Fscript>\n<script>\nif (!window.LOTTIE_ASSETS) {\n// Real Lottie animations for the Bayut KSA Profolio 2.0 handoff.\n// Authored as Lottie JSON (bodymovin v5) so the deliverables can play them,\n// download them, and ship them as .lottie bundles.\n\nconst GREEN = [0.157, 0.694, 0.427];\nconst DEEP = [0.125, 0.557, 0.341];\nconst AMBER = [0.784, 0.545, 0.216];\nconst RED = [0.969, 0.192, 0.192];\nconst GREY = [0.851, 0.863, 0.882];\nconst LINE = [0.725, 0.761, 0.741];\nconst LINE2 = [0.796, 0.827, 0.808];\nconst TINT = [0.831, 0.937, 0.886];\nconst WHITE = [1, 1, 1];\n\nconst tr = (p, s, r, o) => ({ ty: \"tr\", p: { a: 0, k: p || [0, 0] }, a: { a: 0, k: [0, 0] }, s: { a: 0, k: s || [100, 100] }, r: { a: 0, k: r || 0 }, o: { a: 0, k: o == null ? 100 : o }, sk: { a: 0, k: 0 }, sa: { a: 0, k: 0 }, nm: \"tr\" });\nconst grp = (items, p, s, r, o) => ({ ty: \"gr\", nm: \"g\", np: items.length + 1, it: items.concat([tr(p, s, r, o)]) });\nconst fill = (c, o) => ({ ty: \"fl\", c: { a: 0, k: c.concat([1]) }, o: { a: 0, k: o == null ? 100 : o }, r: 1, nm: \"fill\" });\nconst stroke = (c, w, lc) => ({ ty: \"st\", c: { a: 0, k: c.concat([1]) }, o: { a: 0, k: 100 }, w: { a: 0, k: w }, lc: lc || 2, lj: 2, ml: 1, nm: \"stroke\" });\nconst el = (s, p) => ({ ty: \"el\", p: { a: 0, k: p || [0, 0] }, s: { a: 0, k: s }, d: 1, nm: \"el\" });\nconst rc = (s, p, r) => ({ ty: \"rc\", p: { a: 0, k: p || [0, 0] }, s: { a: 0, k: s }, r: { a: 0, k: r || 0 }, d: 1, nm: \"rc\" });\nconst sh = (v, closed) => ({ ty: \"sh\", ks: { a: 0, k: { i: v.map(() => [0, 0]), o: v.map(() => [0, 0]), v: v, c: !!closed } }, nm: \"sh\" });\nconst trim = (endKf, start) => ({ ty: \"tm\", s: { a: 0, k: start || 0 }, e: endKf, o: { a: 0, k: 0 }, m: 1, nm: \"trim\" });\n\n// pairs: [[frame, [values]], ...]\nconst kf = (pairs) => ({\n  a: 1,\n  k: pairs.map((p, i) => i === pairs.length - 1\n    ? { t: p[0], s: p[1] }\n    : { t: p[0], s: p[1], i: { x: [0.25], y: [1] }, o: { x: [0.35], y: [0] } })\n});\nconst st = (v) => ({ a: 0, k: v });\n\nlet idx = 0;\nconst layer = (nm, shapes, ks, op, ip) => {\n  idx += 1;\n  return {\n    ddd: 0, ind: idx, ty: 4, nm: nm, sr: 1, ao: 0, bm: 0,\n    ks: Object.assign({ o: st(100), r: st(0), p: st([0, 0, 0]), a: st([0, 0, 0]), s: st([100, 100, 100]) }, ks),\n    shapes: shapes, ip: ip || 0, op: op, st: 0\n  };\n};\nconst comp = (nm, w, h, op, layers, fr) => { idx = 0; return { v: \"5.12.2\", fr: fr || 60, ip: 0, op: op, w: w, h: h, nm: nm, ddd: 0, assets: [], layers: layers, markers: [] }; };\n\n/* 01 Rank updating: three green dots breathing in sequence. Loops. */\nfunction rankUpdating() {\n  const dots = [0, 1, 2].map(i => {\n    const t0 = i * 8;\n    return layer(\"dot\" + (i + 1), [grp([el([18, 18]), fill(i === 1 ? DEEP : GREEN)])], {\n      p: st([70 + i * 30, 60, 0]),\n      s: kf([[t0, [62, 62]], [t0 + 18, [132, 132]], [t0 + 40, [62, 62]], [72, [62, 62]]]),\n      o: kf([[t0, [42]], [t0 + 18, [100]], [t0 + 40, [42]], [72, [42]]])\n    }, 72);\n  });\n  const sweep = layer(\"shimmer\", [grp([rc([54, 30], [0, 0], 15), fill(TINT, 55)])], {\n    p: kf([[0, [40, 60]], [72, [176, 60]]]),\n    o: kf([[0, [0]], [14, [70]], [58, [70]], [72, [0]]])\n  }, 72);\n  return comp(\"rank_updating\", 200, 120, 72, [sweep].concat(dots));\n}\n\n/* 02 Quality fill: track ring plus a green ring trimming up to the score. */\nfunction qualityFill() {\n  const track = layer(\"track\", [grp([el([78, 78]), stroke(GREY, 9)])], { p: st([100, 60, 0]) }, 40);\n  const value = layer(\"value\", [grp([el([78, 78]), stroke(GREEN, 9), trim(kf([[0, [0]], [38, [92]]]))])], {\n    p: st([100, 60, 0]), r: st(-90)\n  }, 40);\n  const dot = layer(\"cap\", [grp([el([13, 13]), fill(GREEN)])], {\n    p: st([100, 21, 0]), o: kf([[0, [0]], [8, [100]], [40, [100]]]), s: kf([[0, [40, 40]], [14, [100, 100]], [40, [100, 100]]])\n  }, 40);\n  return comp(\"quality_fill\", 200, 120, 40, [track, value, dot]);\n}\n\n/* 03 Fix applied: disc pops, tick draws, ring radiates out once. */\nfunction fixApplied() {\n  const ring = layer(\"ring\", [grp([el([88, 88]), stroke(GREEN, 5)])], {\n    p: st([100, 60, 0]),\n    s: kf([[4, [80, 80]], [40, [180, 180]]]),\n    o: kf([[4, [70]], [40, [0]]])\n  }, 54, 4);\n  const disc = layer(\"disc\", [grp([el([88, 88]), fill(GREEN)])], {\n    p: st([100, 60, 0]),\n    s: kf([[0, [10, 10]], [16, [108, 108]], [24, [100, 100]], [54, [100, 100]]])\n  }, 54);\n  const tick = layer(\"tick\", [grp([sh([[-17, 2], [-5, 14], [18, -13]]), stroke(WHITE, 8), trim(kf([[10, [0]], [30, [100]]]))])], {\n    p: st([100, 60, 0])\n  }, 54, 10);\n  return comp(\"fix_applied\", 200, 120, 54, [ring, disc, tick]);\n}\n\n/* 04 Rank bars: the explainer banner's three bars, one marked amber. Grows once. */\nfunction rankBars() {\n  const specs = [[62, 42, GREY], [100, 74, AMBER], [138, 56, GREY]];\n  const bars = specs.map((b, i) => {\n    const t0 = i * 6;\n    return layer(\"bar\" + (i + 1), [grp([rc([26, b[1]], [0, -b[1] / 2], 5), fill(b[2])])], {\n      p: st([b[0], 102, 0]),\n      s: kf([[t0, [100, 0]], [t0 + 37, [100, 100]]])\n    }, 50);\n  });\n  const base = layer(\"base\", [grp([rc([120, 3], [0, 0], 1.5), fill(GREY)])], { p: st([100, 104, 0]) }, 50);\n  return comp(\"rank_bars\", 200, 120, 50, bars.concat([base]));\n}\n\n/* 05 No internet: the crossed cloud, stroked line art to match the page icons. Loops. */\nfunction noInternet() {\n  const outline = {\n    ty: \"sh\", nm: \"cloud\",\n    ks: { a: 0, k: {\n      v: [[-44, 16], [-44, 1], [-25, -17], [-6, -13], [10, -30], [38, -5], [44, 16]],\n      i: [[0, 8], [0, 11], [-11, 1], [-5, 5], [-11, -3], [-1, -15], [0, -11]],\n      o: [[0, -8], [-1, -13], [11, -1], [5, -5], [13, 3], [2, 11], [0, 8]],\n      c: true\n    } }\n  };\n  const cloud = layer(\"cloud\", [grp([outline, stroke(LINE, 4.4)])], {\n    p: st([120, 68, 0]), s: st([126, 126, 100]),\n    o: kf([[0, [100]], [60, [70]], [120, [100]]])\n  }, 120);\n  const slash = layer(\"slash\", [grp([sh([[-46, -38], [46, 38]]), stroke(RED, 6.6), trim(kf([[6, [0]], [34, [100]]]))])], {\n    p: st([120, 70, 0]), s: st([126, 126, 100])\n  }, 120, 6);\n  return comp(\"no_internet\", 240, 140, 120, [cloud, slash]);\n}\n\n/* 06 No listings: an empty listing card drifting. Loops. */\nfunction emptyListings() {\n  const card = layer(\"card\", [\n    grp([rc([88, 8], [0, 18], 4), fill(LINE2)]),\n    grp([rc([40, 8], [10, -8], 4), fill(LINE2)]),\n    grp([rc([54, 8], [17, -24], 4), fill(LINE)]),\n    grp([rc([34, 34], [-40, -14], 6), fill(TINT)]),\n    grp([rc([132, 88], [0, 0], 10), fill(WHITE), stroke(LINE, 4)])\n  ], {\n    p: kf([[0, [120, 70, 0]], [36, [120, 63, 0]], [72, [120, 70, 0]], [108, [120, 77, 0]], [144, [120, 70, 0]]])\n  }, 144);\n  const plus = layer(\"plus\", [\n    grp([rc([16, 3.6], [0, 0], 1.8), fill(GREEN)]),\n    grp([rc([3.6, 16], [0, 0], 1.8), fill(GREEN)]),\n    grp([el([36, 36]), stroke(GREEN, 3.4)])\n  ], {\n    p: kf([[0, [206, 110, 0]], [36, [206, 103, 0]], [72, [206, 110, 0]], [108, [206, 117, 0]], [144, [206, 110, 0]]]),\n    s: kf([[0, [100, 100]], [18, [112, 112]], [40, [100, 100]], [144, [100, 100]]])\n  }, 144);\n  return comp(\"empty_listings\", 240, 140, 144, [card, plus]);\n}\n\nconst LOTTIE_ASSETS = [\n  { id: \"rank_updating\", name: \"Rank updating\", where: \"Rank tile, drawer and row, while the new position is fetched\", loop: true, dur: \"1200ms\", easing: \"ease-in-out, loops\", replaces: \"mdSpark / dlSpark\", data: rankUpdating() },\n  { id: \"quality_fill\", name: \"Quality score fill\", where: \"Quality section, once when it first scrolls into view\", loop: false, dur: \"640ms\", easing: \"cubic-bezier(.22,1,.36,1)\", replaces: \"growRight on the score bar\", data: qualityFill() },\n  { id: \"fix_applied\", name: \"Fix applied\", where: \"Fix card, on confirm, before the row collapses\", loop: false, dur: \"900ms\", easing: \"cubic-bezier(.22,1,.36,1)\", replaces: \"popIn on the check mark\", data: fixApplied() },\n  { id: \"rank_bars\", name: \"Rank explainer bars\", where: \"Mobile explainer banner tile, grows once on mount\", loop: false, dur: \"800ms\", easing: \"cubic-bezier(.2,.8,.2,1), 90ms stagger\", replaces: \"growUp x3\", data: rankBars() },\n  { id: \"no_internet\", name: \"No internet\", where: \"List area, both surfaces, while offline\", loop: true, dur: \"2000ms\", easing: \"ease-in-out, loops\", replaces: \"static crossed-cloud SVG\", data: noInternet() },\n  { id: \"empty_listings\", name: \"No listings yet\", where: \"Empty state on every tab, and after a filter returns nothing\", loop: true, dur: \"2400ms\", easing: \"ease-in-out, loops\", replaces: \"static empty-state SVG\", data: emptyListings() }\n];\n\nfunction lottieById(id) {\n  const a = LOTTIE_ASSETS.filter(x => x.id === id)[0];\n  return a ? a.data : null;\n}\n\nfunction dotLottieManifest() {\n  return {\n    version: \"1.0\",\n    generator: \"bayut-profolio-handoff\",\n    animations: LOTTIE_ASSETS.map(a => ({ id: a.id, loop: a.loop, speed: 1, autoplay: true, direction: 1, mode: \"forward\" }))\n  };\n}\n\nif (typeof window !== \"undefined\") {\n  window.LOTTIE_ASSETS = LOTTIE_ASSETS;\n  window.lottieById = lottieById;\n  window.dotLottieManifest = dotLottieManifest;\n}\n\n}\n<\u002Fscript>\n<\u002Fhelmet>\n<template id=\"__bundler_thumbnail\">\n<svg sc-camel-view-box=\"0 0 120 120\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"120\" height=\"120\" rx=\"18\" fill=\"#0F3D2A\"><\u002Frect><text x=\"60\" y=\"76\" font-family=\"Figtree, sans-serif\" font-size=\"46\" font-weight=\"800\" fill=\"#7ED0A7\" text-anchor=\"middle\">WD<\u002Ftext><\u002Fsvg>\n<\u002Ftemplate>\n\n<div style=\"min-height: 100vh; background: #F3F4F5\">\n\n  <sc-if value=\"{{ rlTipOn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; left: {{ rlTipX }}; top: {{ rlTipY }}; z-index: 90; pointer-events: none; min-width: 236px; padding: 12px 14px; background: #16181C; border-radius: 10px; box-shadow: 0 18px 44px rgba(0,0,0,0.34); display: flex; flex-direction: column; gap: 7px\">\n      <div style=\"display: flex; align-items: baseline; gap: 7px\">\n        <div style=\"color: #7ED0A7; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700\">{{ rlTipName }}<\u002Fdiv>\n        <div style=\"color: #6B7280; font-family: 'JetBrains Mono', monospace; font-size: 11px\">{{ rlTipTag }}<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-for list=\"{{ rlTipRows }}\" as=\"tr\" hint-placeholder-count=\"8\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 18px\">\n          <div style=\"color: #8A9099; font-family: 'JetBrains Mono', monospace; font-size: 11px\">{{ tr.k }}<\u002Fdiv>\n          <div style=\"color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 11px; text-align: right\">{{ tr.v }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <main style=\"max-width: 1180px; margin: 0 auto; padding: 28px 24px 80px 24px; display: flex; flex-direction: column; gap: 22px\">\n\n    <section id=\"s00\" style=\"padding: 26px 28px; background: white; border-radius: 12px; outline: 1px #EDEDED solid; outline-offset: -1px; display: flex; flex-direction: column; gap: 20px\">\n      <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 24px\">\n        <div style=\"min-width: 0; display: flex; flex-direction: column; gap: 8px\">\n          <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.6px\">00 · SUMMARY<\u002Fdiv>\n          <h1 style=\"margin: 0; color: #222222; font-family: Figtree, sans-serif; font-size: 30px; font-weight: 800; line-height: 36px\">Listing Performance Drawer · Bayut KSA<\u002Fh1>\n          <div style=\"max-width: 760px; color: #4F4F4F; font-size: 15px; line-height: 24px; text-wrap: pretty\">An agent opens My Listings, sees every listing's rank and quality score in the row, and clicks a row to open a right-side drawer that explains why that listing performs the way it does and what to fix. The drawer is one component for all nine listing cases: rank card, trend chart, fix list and upsells all read from the listing, so a perfect listing shows no fix list and a just-posted one shows an empty trend.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: none; width: 268px; padding: 14px; background: #FAFAFA; border-radius: 10px; display: flex; flex-direction: column; gap: 8px\">\n          <sc-for list=\"{{ meta }}\" as=\"m\" hint-placeholder-count=\"8\">\n            <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 10px\">\n              <div style=\"flex: none; color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 11px\">{{ m.k }}<\u002Fdiv>\n              <div style=\"min-width: 0; text-align: right; color: #222222; font-size: 12px; font-weight: 500\">{{ m.v }}<sc-if value=\"{{ m.warn }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"margin-left: 5px; padding: 1px 5px; background: #FFF2F2; border-radius: 4px; color: #CE2929; font-size: 9px; font-weight: 700\">!<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 6px\">\n        <sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"11\">\n          <a href=\"{{ n.href }}\" style=\"height: 30px; padding: 0 12px; background: #FAFAFA; border-radius: 999px; display: flex; align-items: center; gap: 7px; text-decoration: none\" style-hover=\"background: #F0FAF5\">\n            <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600\">{{ n.num }}<\u002Fdiv>\n            <div style=\"color: #4F4F4F; font-size: 12px; white-space: nowrap\">{{ n.label }}<\u002Fdiv>\n          <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"padding: 14px 16px; background: #F0FAF5; border-radius: 10px; border-left: 3px #28B16D solid; display: flex; flex-direction: column; gap: 4px\">\n        <div style=\"color: #208E57; font-size: 12px; font-weight: 700\">Phase rule<\u002Fdiv>\n        <div style=\"color: #2F4F41; font-size: 13px; line-height: 20px; text-wrap: pretty\">The drawer explains and links out. It does not edit the listing: every fix card ends in a CTA that hands off to the existing edit or purchase flow, and nothing inside the drawer writes to the listing except Apply Signature and Refresh, which only trigger the rank-updating state.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"s01\" style=\"padding: 22px 24px; background: white; border-radius: 12px; outline: 1px #EDEDED solid; outline-offset: -1px; display: flex; flex-direction: column; gap: 14px\">\n      <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.6px\">01 · SCREEN INDEX<\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 8px\">\n        <sc-for list=\"{{ screens }}\" as=\"s\" hint-placeholder-count=\"12\">\n          <a href=\"{{ s.href }}\" style=\"padding: 12px; background: #FAFAFA; border-radius: 8px; display: flex; align-items: flex-start; gap: 10px; text-decoration: none\" style-hover=\"background: #F0FAF5\">\n            <div style=\"width: 24px; height: 24px; flex: none; background: white; border-radius: 6px; outline: 1px #E6E6E6 solid; outline-offset: -1px; display: flex; align-items: center; justify-content: center; color: #249F62; font-size: 12px; font-weight: 700\">{{ s.id }}<\u002Fdiv>\n            <div style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\">\n              <div style=\"color: #222222; font-size: 13px; font-weight: 600\">{{ s.label }}<\u002Fdiv>\n              <div style=\"color: #707070; font-size: 11px; font-weight: 300\">{{ s.state }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"s02\" style=\"padding: 22px 24px; background: white; border-radius: 12px; outline: 1px #EDEDED solid; outline-offset: -1px; display: flex; flex-direction: column; gap: 14px\">\n      <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px\">\n        <div style=\"display: flex; flex-direction: column; gap: 4px\">\n          <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.6px\">02 · PROTOTYPE<\u002Fdiv>\n          <div style=\"color: #626262; font-size: 12px; font-weight: 300\">The real build, embedded. Click a row to open the drawer, switch tabs, open any modal.<\u002Fdiv>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ reloadProto }}\" style=\"height: 34px; padding: 0 12px; background: white; border-radius: 8px; outline: 1px #E6E6E6 solid; outline-offset: -1px; display: flex; align-items: center; color: #4F4F4F; font-size: 12px; font-weight: 500; cursor: pointer\" style-hover=\"outline-color: #DEDEDE\">Reload build<\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ redline }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; padding: 5px 10px; background: #FFF2F2; border-radius: 6px\">\n          <div style=\"color: #CE2929; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700\">MEASURED<\u002Fdiv>\n          <div style=\"color: #CE2929; font-family: 'JetBrains Mono', monospace; font-size: 10px\">{{ protoMeasured }}<\u002Fdiv>\n          <div style=\"width: 1px; height: 11px; background: #FFC9C9\"><\u002Fdiv>\n          <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 10px\">spec row 1274 · pad 20<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"position: relative; height: 660px; background: #F3F4F5; border-radius: 10px; outline: 1px #E6E6E6 solid; outline-offset: -1px; overflow: hidden\">\n        <div style=\"position: absolute; left: 0; top: 0; width: 1440px; height: 1100px; transform: scale({{ protoScale }}); transform-origin: 0 0\">\n          <dc-import name=\"My Listing Web\" no-auto-tour=\"{{ true }}\" hint-size=\"1440px,1100px\"><\u002Fdc-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px\">\n        <div style=\"display: flex; align-items: center; gap: 6px\">\n          <sc-for list=\"{{ scaleOptions }}\" as=\"sc\" hint-placeholder-count=\"3\">\n            <div sc-camel-on-click=\"{{ sc.pick }}\" style=\"height: 30px; padding: 0 12px; border-radius: 999px; display: flex; align-items: center; cursor: pointer; background: {{ sc.bg }}; outline: 1px {{ sc.border }} solid; outline-offset: -1px; color: {{ sc.ink }}; font-size: 12px; font-weight: {{ sc.weight }}\">{{ sc.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"color: #9D9D9D; font-size: 11px; font-weight: 300\">Live build at 1440 x 1100, scaled to fit. Everything in it is real: five tabs, nine listing cases, the drawer, the explainer, filters, share, booking and services.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; align-items: center; gap: 8px; color: #9D9D9D; font-size: 11px; font-weight: 300\">\n        <div style=\"padding: 1px 6px; background: #FEF8F0; border-radius: 4px; color: #C88B37; font-size: 10px; font-weight: 700\">→<\u002Fdiv>\n        <div>This is the production build embedded in full, not a recreation. Click any row to open the drawer, switch tabs, open More Filters, or use a row menu. Section 03 below shows each screen isolated with its own state chips.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n\n    <section id=\"sBTN\" style=\"padding: 22px 24px; background: white; border-radius: 12px; outline: 1px #EDEDED solid; outline-offset: -1px; display: flex; flex-direction: column; gap: 16px\">\n      <div style=\"display: flex; flex-direction: column; gap: 3px\">\n        <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.6px\">02b · BUTTON STATES: APPLIED AND UNAPPLIED<\u002Fdiv>\n        <div style=\"color: #626262; font-size: 12px; font-weight: 300\">The real desktop components, lifted from the build at 1:1. Every action has a resting state and an applied state: the applied state stays in place, reads grey, and says what happened.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 8px\">\n        <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">Upgrades column<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: minmax(150px, 0.7fr) minmax(240px, 1fr) minmax(240px, 1fr); gap: 12px; padding: 12px; background: #FAFAFA; border-radius: 8px; align-items: stretch\">\n          <div style=\"min-width: 0; display: flex; flex-direction: column; gap: 4px\">\n            <div style=\"color: #222222; font-size: 13px; font-weight: 600\">Signature<\u002Fdiv>\n            <div style=\"color: #9D9D9D; font-size: 11px; line-height: 15px\">Full width, first row of the Upgrades cell<\u002Fdiv>\n          <\u002Fdi -linecap=\"round\"><\u002Fpath><path d=\"M13.8 1.6v3.4H10.4\" stroke=\"#C4C4C4\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><div style=\"position: absolute; bottom: 1px; right: 1px; width: 17px; height: 17px; background: #28B16D; border-radius: 9999px; outline: 1.5px white solid; display: flex; align-items: center; justify-content: center\"><svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 10 10\" fill=\"none\"><path d=\"M1.7 5.1 3.8 7.3 8.4 2.4\" stroke=\"white\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div style=\"color: #707070; font-size: 11px; line-height: 16px\">Grey glyph plus a green tick badge, tooltip \"Already refreshed today\". The drawer card shows the Refreshed Today chip.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 8px\">\n        <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">Drawer: fixes and saving<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: minmax(150px, 0.7fr) minmax(240px, 1fr) minmax(240px, 1fr); gap: 12px; padding: 12px; background: #FAFAFA; border-radius: 8px; align-items: stretch\">\n          <div style=\"min-width: 0; display: flex; flex-direction: column; gap: 4px\">\n            <div style=\"color: #222222; font-size: 13px; font-weight: 600\">Fix weight<\u002Fdiv>\n            <div style=\"color: #9D9D9D; font-size: 11px; line-height: 15px\">Fix card header, right side<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"min-width: 0; padding: 12px; background: white; border-radius: 8px; outline: 1px #EDEDED solid; outline-offset: -1px; display: flex; flex-direction: column; gap: 9px\">\n            <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">UNAPPLIED<\u002Fdiv>\n            <div style=\"display: flex; align-items: center; gap: 6px\"><div style=\"padding: 5px 10px; background: #E9F7F0; border-radius: 100px; color: #10603A; font-size: 12px; font-weight: 600\">+20%<\u002Fdiv><\u002Fdiv>\n            <div style=\"color: #707070; font-size: 11px; line-height: 16px\">Green tint pill carrying the score weight in per cent, never points.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"min-width: 0; padding: 12px; background: white; border-radius: 8px; outline: 1px #EDEDED solid; outline-offset: -1px; display: flex; flex-direction: column; gap: 9px\">\n            <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">APPLIED<\u002Fdiv>\n            <div style=\"display: flex; align-items: center; gap: 6px\"><div style=\"padding: 5px 10px; background: #E9F7F0; border-radius: 100px; color: #10603A; font-size: 12px; font-weight: 600\">Fixed<\u002Fdiv><\u002Fdiv>\n            <div style=\"color: #707070; font-size: 11px; line-height: 16px\">Weight is replaced by Fixed, the card collapses and stops counting toward the save bar.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: minmax(150px, 0.7fr) minmax(240px, 1fr) minmax(240px, 1fr); gap: 12px; padding: 12px; background: #FAFAFA; border-radius: 8px; align-items: stretch\">\n          <div style=\"min-width: 0; display: flex; flex-direction: column; gap: 4px\">\n            <div style=\"color: #222222; font-size: 13px; font-weight: 600\">Save bar<\u002Fdiv>\n            <div style=\"color: #9D9D9D; font-size: 11px; line-height: 15px\">Sticky footer inside the 780px drawer<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"min-width: 0; padding: 12px; background: white; border-radius: 8px; outline: 1px #EDEDED solid; outline-offset: -1px; display: flex; flex-direction: column; gap: 9px\">\n            <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">UNAPPLIED<\u002Fdiv>\n            <div style=\"display: flex; align-items: center; gap: 6px\"><div style=\"color: #9D9D9D; font-size: 12px\">Not rendered<\u002Fdiv><\u002Fdiv>\n            <div style=\"color: #707070; font-size: 11px; line-height: 16px\">Hidden until a fix is touched, so the drawer ends on content.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"min-width: 0; padding: 12px; background: white; border-radius: 8px; outline: 1px #EDEDED solid; outline-offset: -1px; display: flex; flex-direction: column; gap: 9px\">\n            <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">APPLIED<\u002Fdiv>\n            <div style=\"display: flex; align-items: center; gap: 6px\"><div style=\"display: flex; align-items: center; gap: 10px\"><div style=\"color: #222222; font-size: 13px; font-weight: 700\">1 change ready to save<\u002Fdiv><div style=\"height: 36px; padding: 0 14px; background: white; border-radius: 8px; outline: 1px #DEDEDE solid; outline-offset: -1px; display: flex; align-items: center; color: #626262; font-size: 13px; font-weight: 600\">Discard<\u002Fdiv><div style=\"height: 36px; padding: 0 18px; background: #249F62; border-radius: 8px; display: flex; align-items: center; color: white; font-size: 13px; font-weight: 700\">Save changes<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div style=\"color: #707070; font-size: 11px; line-height: 16px\">Full-width sticky footer with the change count, the gain chip, Discard and the green CTA.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 8px\">\n        \n        \n        \n        \n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"sGAL\" style=\"padding: 22px 24px; background: white; border-radius: 12px; outline: 1px #EDEDED solid; outline-offset: -1px; display: flex; flex-direction: column; gap: 16px\">\n      <div style=\"display: flex; flex-direction: column; gap: 3px\">\n        <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.6px\">02c · CASES, STATES AND EMPTY STATES<\u002Fdiv>\n        <div style=\"color: #626262; font-size: 12px; font-weight: 300\">Every case and every state the build can be in, one click each. The frame below is the live build, driven by the same scenario props engineering will read.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; align-items: flex-start; gap: 18px; flex-wrap: wrap\">\n        <div style=\"flex: 0 0 260px; min-width: 240px; display: flex; flex-direction: column; gap: 12px\">\n          <sc-for list=\"{{ galGroups }}\" as=\"g\" hint-placeholder-count=\"7\">\n            <div style=\"display: flex; flex-direction: column; gap: 7px\">\n              <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">{{ g.title }}<\u002Fdiv>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n                <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"5\">\n                  <div sc-camel-on-click=\"{{ it.pick }}\" style=\"height: 30px; padding: 0 12px; border-radius: 999px; display: flex; align-items: center; cursor: pointer; background: {{ it.bg }}; outline: 1px {{ it.border }} solid; outline-offset: -1px; color: {{ it.ink }}; font-size: 12px; font-weight: {{ it.weight }}\">{{ it.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"padding: 12px 14px; background: #FAFAFA; border-radius: 8px; display: flex; flex-direction: column; gap: 5px\">\n            <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">CURRENT SCENARIO<\u002Fdiv>\n            <div style=\"color: #222222; font-size: 13px; font-weight: 600\">{{ galTitle }}<\u002Fdiv>\n            <div style=\"color: #626262; font-size: 12px; line-height: 18px; text-wrap: pretty\">{{ galNote }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 620px; min-width: 0; position: relative; height: 700px; background: #F3F4F5; border-radius: 10px; outline: 1px #E6E6E6 solid; outline-offset: -1px; overflow: hidden\">\n          <div style=\"position: absolute; left: 0; top: 0; width: 1440px; height: 1140px; transform: scale(0.62); transform-origin: 0 0\">\n            <dc-import name=\"My Listing Web\" no-auto-tour=\"{{ true }}\" init-tab=\"{{ galTab }}\" init-case=\"{{ galCase }}\" init-view=\"{{ galView }}\" hint-size=\"1440px,1140px\"><\u002Fdc-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section id=\"s03\" style=\"display: flex; flex-direction: column; gap: 14px\">\n      <div style=\"padding: 18px 24px; background: white; border-radius: 12px; outline: 1px #EDEDED solid; outline-offset: -1px; display: flex; align-items: center; justify-content: space-between; gap: 16px\">\n        <div style=\"display: flex; flex-direction: column; gap: 3px\">\n          <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.6px\">03 · SCREENS &amp; STATES<\u002Fdiv>\n          <div style=\"color: #626262; font-size: 12px; font-weight: 300\">Twelve screens. Element tables carry the measured values; rules carry what a table cannot say.<\u002Fdiv>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ toggleRedline }}\" style=\"height: 34px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; gap: 6px; cursor: pointer; background: {{ rlBg }}; outline: 1px {{ rlBorder }} solid; outline-offset: -1px\">\n          <div style=\"color: {{ rlInk }}; font-size: 12px; font-weight: 600\">Show redlines<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-for list=\"{{ specs }}\" as=\"sp\" hint-placeholder-count=\"12\">\n        <div id=\"{{ sp.anchor }}\" style=\"padding: 22px 24px; background: white; border-radius: 12px; outline: 1px #EDEDED solid; outline-offset: -1px; display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"display: flex; align-items: flex-start; gap: 12px\">\n            <div style=\"width: 30px; height: 30px; flex: none; background: #F0FAF5; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #249F62; font-size: 14px; font-weight: 700\">{{ sp.id }}<\u002Fdiv>\n            <div style=\"min-width: 0; display: flex; flex-direction: column; gap: 3px\">\n              <div style=\"color: #222222; font-family: Figtree, sans-serif; font-size: 18px; font-weight: 700\">{{ sp.label }}<\u002Fdiv>\n              <div style=\"color: #707070; font-size: 12px; font-weight: 300\">{{ sp.state }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"max-width: 900px; color: #4F4F4F; font-size: 13px; line-height: 21px; text-wrap: pretty\">{{ sp.prose }}<\u002Fdiv>\n\n          <div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px\">\n            <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 6px\">\n              <sc-for list=\"{{ sp.states }}\" as=\"stt\" hint-placeholder-count=\"2\">\n                <div sc-camel-on-click=\"{{ stt.pick }}\" style=\"height: 32px; padding: 0 14px; border-radius: 999px; display: flex; align-items: center; cursor: pointer; background: {{ stt.bg }}; outline: 1px {{ stt.border }} solid; outline-offset: -1px; color: {{ stt.ink }}; font-size: 12px; font-weight: {{ stt.weight }}\">{{ stt.label }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div sc-camel-on-click=\"{{ toggleRedline }}\" style=\"height: 32px; padding: 0 14px; border-radius: 999px; display: flex; align-items: center; cursor: pointer; background: {{ rlChipBg }}; outline: 1px {{ rlChipBorder }} solid; outline-offset: -1px; color: {{ rlChipInk }}; font-size: 12px; font-weight: 600\">Redlines<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"position: relative; height: {{ sp.frameH }}; background: #F3F4F5; border-radius: 10px; outline: 1px #EDEDED solid; outline-offset: -1px; overflow: hidden\">\n            <div data-screen-slot=\"{{ sp.id }}\" style=\"position: absolute; inset: 0\"><\u002Fdiv>\n            <sc-if value=\"{{ sp.mounted }}\" hint-placeholder-val=\"{{ false }}\">\n              <div data-mock-id=\"{{ sp.id }}\" style=\"position: absolute; left: 0; top: 0; width: 1440px; height: {{ sp.innerH }}; transform: scale(0.62); transform-origin: 0 0\">\n                <dc-import name=\"My Listing Web\" no-auto-tour=\"{{ true }}\" init-tab=\"{{ sp.initTab }}\" init-case=\"{{ sp.initCase }}\" init-view=\"{{ sp.initView }}\" hint-size=\"1440px,1100px\"><\u002Fdc-import>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ sp.notMounted }}\" hint-placeholder-val=\"{{ true }}\">\n              <div sc-camel-on-click=\"{{ sp.mount }}\" style=\"position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer\">\n                <div style=\"height: 38px; padding: 0 18px; background: white; border-radius: 999px; outline: 1px #E6E6E6 solid; outline-offset: -1px; display: flex; align-items: center; color: #4F4F4F; font-size: 13px; font-weight: 600\">Load screen {{ sp.id }}<\u002Fdiv>\n                <div style=\"color: #9D9D9D; font-size: 11px; font-weight: 300\">Renders the real build at this state<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ redline }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"position: absolute; left: 10px; top: 10px; z-index: 3; display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px; background: #16181C; border-radius: 6px; pointer-events: none\">\n                <div style=\"color: #7ED0A7; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700\">INSPECT<\u002Fdiv>\n                <div style=\"color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 10px\">{{ sp.mock.measured }}<\u002Fdiv>\n                <div style=\"width: 1px; height: 11px; background: #3A3F47\"><\u002Fdiv>\n                <div style=\"color: #8A9099; font-family: 'JetBrains Mono', monospace; font-size: 10px\">hover any element<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"border-radius: 8px; outline: 1px #F0F0F0 solid; outline-offset: -1px; overflow: hidden\">\n            <div style=\"padding: 9px 12px; background: #FAFAFA; display: grid; grid-template-columns: 220px 1fr; gap: 12px; border-bottom: 1px #F0F0F0 solid\">\n              <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">ELEMENT<\u002Fdiv>\n              <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">SPEC<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ sp.rows }}\" as=\"row\" hint-placeholder-count=\"5\">\n              <div style=\"padding: 9px 12px; display: grid; grid-template-columns: 220px 1fr; gap: 12px; border-bottom: 1px #F7F7F7 solid; align-items: baseline\">\n                <div style=\"color: #222222; font-size: 12px; font-weight: 500\">{{ row.el }}<\u002Fdiv>\n                <div style=\"display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap\">\n                  <sc-if value=\"{{ row.hasBadge }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; background: {{ row.badgeBg }}; color: {{ row.badgeInk }}\">{{ row.badge }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div style=\"min-width: 0; color: #4F4F4F; font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 18px\">{{ row.spec }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ sp.hasRules }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; flex-direction: column; gap: 6px\">\n              <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">RULES<\u002Fdiv>\n              <sc-for list=\"{{ sp.rules }}\" as=\"rule\" hint-placeholder-count=\"2\">\n                <div style=\"display: flex; align-items: flex-start; gap: 8px\">\n                  <div style=\"width: 4px; height: 4px; flex: none; margin-top: 8px; background: #28B16D; border-radius: 999px\"><\u002Fdiv>\n                  <div style=\"min-width: 0; color: #4F4F4F; font-size: 12px; line-height: 19px; text-wrap: pretty\">{{ rule.text }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsection>\n\n    <section id=\"s04\" style=\"padding: 22px 24px; background: white; border-radius: 12px; outline: 1px #EDEDED solid; outline-offset: -1px; display: flex; flex-direction: column; gap: 16px\">\n      <div style=\"display: flex; flex-direction: column; gap: 3px\">\n        <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.6px\">04 · INTERACTION &amp; MOTION<\u002Fdiv>\n        <div style=\"color: #626262; font-size: 12px; font-weight: 300\">Every row replays the real CSS. Nothing here is a description of an animation that does not exist.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-for list=\"{{ motions }}\" as=\"mo\" hint-placeholder-count=\"8\">\n        <div style=\"padding: 14px; background: #FAFAFA; border-radius: 10px; display: grid; grid-template-columns: 54px 1fr 168px 120px; gap: 14px; align-items: center\">\n          <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600\">{{ mo.num }}<\u002Fdiv>\n          <div style=\"min-width: 0; display: flex; flex-direction: column; gap: 3px\">\n            <div style=\"color: #222222; font-size: 13px; font-weight: 600\">{{ mo.trigger }}<\u002Fdiv>\n            <div style=\"color: #626262; font-size: 11px; line-height: 16px\">{{ mo.what }}<\u002Fdiv>\n            <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-top: 2px\">\n              <div style=\"padding: 1px 6px; background: white; border-radius: 4px; outline: 1px #EDEDED solid; outline-offset: -1px; color: #4F4F4F; font-family: 'JetBrains Mono', monospace; font-size: 10px\">{{ mo.dur }}<\u002Fdiv>\n              <div style=\"padding: 1px 6px; background: white; border-radius: 4px; outline: 1px #EDEDED solid; outline-offset: -1px; color: #4F4F4F; font-family: 'JetBrains Mono', monospace; font-size: 10px\">{{ mo.easing }}<\u002Fdiv>\n              <sc-if value=\"{{ mo.hasBadge }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; background: {{ mo.badgeBg }}; color: {{ mo.badgeInk }}\">{{ mo.badge }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 300\">{{ mo.notes }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height: 58px; background: white; border-radius: 8px; outline: 1px #EDEDED solid; outline-offset: -1px; display: flex; align-items: center; justify-content: center; overflow: hidden\">\n            <div style=\"animation: {{ mo.anim }}\">{{ mo.demo }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ mo.replay }}\" style=\"height: 34px; border-radius: 8px; background: #F0FAF5; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; color: #249F62; font-size: 12px; font-weight: 600\" style-hover=\"background: #D4EFE2\">\n            <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\"><path d=\"M13.4 8a5.4 5.4 0 1 1-1.6-3.8\" stroke=\"#249F62\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M13.6 1.8v3.2h-3.2\" stroke=\"#249F62\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <div>Replay<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n\n      <div style=\"display: flex; flex-direction: column; gap: 8px\">\n        <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">POINTER BEHAVIOURS<\u002Fdiv>\n        <div style=\"border-radius: 8px; outline: 1px #F0F0F0 solid; outline-offset: -1px; overflow: hidden\">\n          <div style=\"padding: 9px 12px; background: #FAFAFA; display: grid; grid-template-columns: 240px 1fr 1fr; gap: 12px; border-bottom: 1px #F0F0F0 solid\">\n            <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">INTERACTION<\u002Fdiv>\n            <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">BEHAVIOUR<\u002Fdiv>\n            <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">CONFLICTS WITH<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ gestures }}\" as=\"g\" hint-placeholder-count=\"4\">\n            <div style=\"padding: 9px 12px; display: grid; grid-template-columns: 240px 1fr 1fr; gap: 12px; border-bottom: 1px #F7F7F7 solid; align-items: baseline\">\n              <div style=\"color: #222222; font-size: 12px; font-weight: 500\">{{ g.name }}<\u002Fdiv>\n              <div style=\"color: #4F4F4F; font-size: 12px; line-height: 18px\">{{ g.behaviour }}<\u002Fdiv>\n              <div style=\"color: #707070; font-size: 12px; line-height: 18px\">{{ g.conflict }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding: 12px 14px; background: #F7FCFC; border-radius: 8px; display: flex; align-items: flex-start; gap: 10px\">\n        <div style=\"flex: none; padding: 1px 6px; background: #E9F7F0; border-radius: 4px; color: #208E57; font-size: 10px; font-weight: 700\">CSS<\u002Fdiv>\n        <div style=\"min-width: 0; color: #4F7B7D; font-size: 12px; line-height: 18px; text-wrap: pretty\">Everything above is CSS transitions and keyframes. The six illustration and sequence moments that do ship as files are in section 05.3, and the rows here that one of them replaces are tagged. Every keyframe is disabled under prefers-reduced-motion, and the end state is shown immediately.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"s05\" style=\"padding: 22px 24px; background: white; border-radius: 12px; outline: 1px #EDEDED solid; outline-offset: -1px; display: flex; flex-direction: column; gap: 16px\">\n      <div style=\"display: flex; flex-direction: column; gap: 3px\">\n        <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.6px\">05 · ASSETS<\u002Fdiv>\n        <div style=\"color: #626262; font-size: 12px; font-weight: 300\">Every icon is inline SVG. Click a tile to copy its markup.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-direction: column; gap: 8px\">\n        <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">05.1 VECTOR<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 8px\">\n          <sc-for list=\"{{ icons }}\" as=\"ic\" hint-placeholder-count=\"10\">\n            <div sc-camel-on-click=\"{{ ic.copy }}\" style=\"padding: 12px; background: #FAFAFA; border-radius: 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer\" style-hover=\"background: #F0FAF5\">\n              <div style=\"height: 30px; display: flex; align-items: center; justify-content: center\">{{ ic.svg }}<\u002Fdiv>\n              <div style=\"text-align: center; color: #222222; font-family: 'JetBrains Mono', monospace; font-size: 10px\">{{ ic.name }}<\u002Fdiv>\n              <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 300\">{{ ic.grid }}<\u002Fdiv>\n              <div style=\"color: {{ ic.copyInk }}; font-size: 10px; font-weight: 600\">{{ ic.copyLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-direction: column; gap: 8px\">\n        <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">05.2 RASTER<\u002Fdiv>\n        <div style=\"padding: 14px; background: #FFF8F8; border-radius: 8px; outline: 1px #FFE0E0 solid; outline-offset: -1px; display: flex; align-items: flex-start; gap: 10px\">\n          <div style=\"flex: none; padding: 1px 6px; background: #FFF2F2; border-radius: 4px; color: #CE2929; font-size: 10px; font-weight: 700\">!<\u002Fdiv>\n          <div style=\"min-width: 0; display: flex; flex-direction: column; gap: 4px\">\n            <div style=\"color: #CE2929; font-size: 12px; font-weight: 600\">No production imagery in this delivery<\u002Fdiv>\n            <div style=\"color: #4F4F4F; font-size: 12px; line-height: 18px\">Every thumbnail is a striped CSS placeholder: repeating-linear-gradient(135deg, #EDEDED 0 6px, #F6F6F6 6px 12px). Real listing photography is required before ship. Web needs 1x and 2x; there are no density folders on this platform.<\u002Fdiv>\n            <div style=\"color: #4F4F4F; font-size: 12px; line-height: 18px\">A listing with no photos, and a photo that fails to load, both fall back to the same box: #F5F5F5, a centred camera-slash glyph in #9D9D9D, no count badge, and the words No photos. That state is specified in 06.10 and 06.11 but is not drawn in either build yet.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-direction: column; gap: 10px\">\n        <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap\">\n          <div style=\"display: flex; flex-direction: column; gap: 3px\">\n            <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">05.3 DOTLOTTIE<\u002Fdiv>\n            <div style=\"color: #626262; font-size: 12px; font-weight: 300\">Six moments ship as files, because they are illustrations or multi-shape sequences rather than one property moving. Each tile below plays the real animation data.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 8px\">\n            <div sc-camel-on-click=\"{{ replayLotties }}\" style=\"height: 32px; padding: 0 13px; border-radius: 8px; background: #F0FAF5; color: #249F62; font-size: 12px; font-weight: 600; display: flex; align-items: center; cursor: pointer\" style-hover=\"background: #D4EFE2\">Replay all<\u002Fdiv>\n            <a href=\"design_handoff_listing_performance/lottie/bayut_profolio_motion.lottie\" download=\"bayut_profolio_motion.lottie\" style=\"height: 32px; padding: 0 13px; border-radius: 8px; background: #28B16D; color: white; font-size: 12px; font-weight: 600; display: flex; align-items: center\">Download all .lottie<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(272px, 1fr)); gap: 8px\">\n          <sc-for list=\"{{ lotties }}\" as=\"lt\" hint-placeholder-count=\"6\">\n            <div style=\"padding: 12px; background: #FAFAFA; border-radius: 10px; display: flex; flex-direction: column; gap: 10px\">\n              <div data-lottie=\"{{ lt.id }}\" style=\"height: 108px; background: white; border-radius: 8px; outline: 1px #EDEDED solid; outline-offset: -1px\"><\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 10px\">\n                  <div style=\"color: #222222; font-size: 13px; font-weight: 600\">{{ lt.name }}<\u002Fdiv>\n                  <div style=\"padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; background: {{ lt.loopBg }}; color: {{ lt.loopInk }}\">{{ lt.loopLabel }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"color: #626262; font-size: 11px; line-height: 16px; text-wrap: pretty\">{{ lt.where }}<\u002Fdiv>\n                <div style=\"display: flex; flex-wrap: wrap; gap: 6px; padding-top: 2px\">\n                  <div style=\"padding: 1px 6px; background: white; border-radius: 4px; outline: 1px #EDEDED solid; outline-offset: -1px; color: #4F4F4F; font-family: 'JetBrains Mono', monospace; font-size: 10px\">{{ lt.dur }}<\u002Fdiv>\n                  <div style=\"padding: 1px 6px; background: white; border-radius: 4px; outline: 1px #EDEDED solid; outline-offset: -1px; color: #4F4F4F; font-family: 'JetBrains Mono', monospace; font-size: 10px\">{{ lt.size }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding-top: 2px\">{{ lt.file }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 6px\">\n                <div sc-camel-on-click=\"{{ lt.replay }}\" style=\"flex: 1; height: 30px; border-radius: 7px; background: #F0FAF5; color: #249F62; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer\" style-hover=\"background: #D4EFE2\">Replay<\u002Fdiv>\n                <a href=\"{{ lt.lottieHref }}\" download=\"\" style=\"flex: 1; height: 30px; border-radius: 7px; background: white; outline: 1px #E6E6E6 solid; outline-offset: -1px; color: #4F4F4F; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center\">.lottie<\u002Fa>\n                <a href=\"{{ lt.jsonHref }}\" download=\"\" style=\"flex: 1; height: 30px; border-radius: 7px; background: white; outline: 1px #E6E6E6 solid; outline-offset: -1px; color: #4F4F4F; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center\">.json<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"padding: 12px 14px; background: #F0FAF5; border-radius: 8px; display: flex; align-items: flex-start; gap: 10px\">\n          <div style=\"flex: none; padding: 1px 6px; background: #D4EFE2; border-radius: 4px; color: #208E57; font-size: 10px; font-weight: 700\">USE<\u002Fdiv>\n          <div style=\"min-width: 0; color: #2F4F41; font-size: 12px; line-height: 18px; text-wrap: pretty\">60fps, brand palette baked in, no text layers, so the same file works in EN and AR. Loop files run until their state ends; one-shot files play once on the trigger and hold the last frame. Under prefers-reduced-motion do not mount the player: render the last frame as a still. Everything else in section 04 stays CSS.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"s06\" style=\"padding: 22px 24px; background: white; border-radius: 12px; outline: 1px #EDEDED solid; outline-offset: -1px; display: flex; flex-direction: column; gap: 14px\">\n      <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px\">\n        <div style=\"display: flex; flex-direction: column; gap: 3px\">\n          <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.6px\">06 · EDGE CASES &amp; ERROR STATES<\u002Fdiv>\n          <div style=\"color: #626262; font-size: 12px; font-weight: 300\">Unresolved rows are flagged, never dropped.<\u002Fdiv>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ toggleUnresolved }}\" style=\"height: 32px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; cursor: pointer; background: {{ unBg }}; outline: 1px {{ unBorder }} solid; outline-offset: -1px; color: {{ unInk }}; font-size: 12px; font-weight: 600\">{{ unLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-radius: 8px; outline: 1px #F0F0F0 solid; outline-offset: -1px; overflow: hidden\">\n        <div style=\"padding: 9px 12px; background: #FAFAFA; display: grid; grid-template-columns: 54px 1.1fr 1.5fr 1fr; gap: 12px; border-bottom: 1px #F0F0F0 solid\">\n          <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">#<\u002Fdiv>\n          <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">CASE<\u002Fdiv>\n          <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">EXPECTED BEHAVIOUR<\u002Fdiv>\n          <div style=\"color: #9D9D9D; font-size: 10px; font-weight: 700; letter-spacing: 0.5px\">COPY<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ edges }}\" as=\"e\" hint-placeholder-count=\"10\">\n          <div style=\"padding: 10px 12px; display: {{ e.display }}; grid-template-columns: 54px 1.1fr 1.5fr 1fr; gap: 12px; border-bottom: 1px #F7F7F7 solid; align-items: baseline; background: {{ e.bg }}\">\n            <div style=\"display: flex; align-items: center; gap: 5px\">\n              <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 11px\">{{ e.num }}<\u002Fdiv>\n              <sc-if value=\"{{ e.warn }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding: 0 4px; background: #FFF2F2; border-radius: 3px; color: #CE2929; font-size: 9px; font-weight: 700\">!<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"color: #222222; font-size: 12px; font-weight: 500; line-height: 18px\">{{ e.case }}<\u002Fdiv>\n            <div style=\"color: #4F4F4F; font-size: 12px; line-height: 18px\">{{ e.behaviour }}<\u002Fdiv>\n            <div style=\"display: flex; align-items: baseline; gap: 5px\">\n              <sc-if value=\"{{ e.pencil }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"flex: none; padding: 0 4px; background: #F0F7FC; border-radius: 3px; color: #3B84C4; font-size: 9px; font-weight: 700\">✎<\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"min-width: 0; color: #626262; font-size: 12px; line-height: 18px\">{{ e.copy }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"s07\" style=\"padding: 22px 24px; background: white; border-radius: 12px; outline: 1px #EDEDED solid; outline-offset: -1px; display: flex; flex-direction: column; gap: 14px\">\n      <div style=\"display: flex; flex-direction: column; gap: 3px\">\n        <div style=\"color: #9D9D9D; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.6px\">07 · ACCEPTANCE CRITERIA<\u002Fdiv>\n        <div style=\"color: #626262; font-size: 12px; font-weight: 300\">Verifiable without opening Figma. QA and the ticket cite these numbers.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 10px\">\n        <sc-for list=\"{{ criteria }}\" as=\"c\" hint-placeholder-count=\"8\">\n          <div style=\"padding: 14px; background: #FAFAFA; border-radius: 10px; display: flex; flex-direction: column; gap: 9px\">\n            <div style=\"display: flex; align-items: baseline; gap: 8px\">\n              <div style=\"color: #249F62; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600\">{{ c.num }}<\u002Fdiv>\n              <div style=\"color: #222222; font-size: 13px; font-weight: 700 raphy\"]], rules: [] },\n      { id: \"L\", label: \"Sorting and filtering skeleton\", state: \"replaces the row list\",\n        prose: \"Rows are replaced by shimmering skeletons with a pulsing status line, and the page is locked for the duration.\",\n        rows: [\n          [\"Sort\", \"4.5s, Sorting 65 listings...\"],\n          [\"Filter\", \"1.8s, Filtering 65 listings...\"],\n          [\"Shimmer\", \"linear-gradient 400% background-size, dlSkel 1.4s ease-in-out infinite\"],\n          [\"Status line\", \"statusPulse 1.4s ease-in-out infinite\"]\n        ], rules: [\"Both flows lock the page. No row is clickable while the skeleton shows.\"] }\n    ];\n  }\n\n  galDefs() {\n    return {\n      list: [\"Listing list\", \"The Active tab as it loads: nine listing cases, rank and quality on every row.\", \"active\", \"highImp\", \"\"],\n      good: [\"Happy case\", \"Rank 1 of 132, quality 100, Signature applied, no fix list.\", \"active\", \"happy\", \"\"],\n      highimp: [\"High impression, low leads\", \"Views are strong, leads are not. Rank 52 of 240 with three fixes.\", \"active\", \"highImp\", \"\"],\n      bad: [\"All bad\", \"Rank 98 of 120, three fixes and four extras behind the label.\", \"active\", \"allBad\", \"\"],\n      sixfixes: [\"Everything unfinished\", \"Quality 35, six fixes, the worst case an agent can land on.\", \"active\", \"sixFixes\", \"\"],\n      lowimp: [\"Low impression, high conversion\", \"Converts 1.8x better than the area, it just is not being seen.\", \"active\", \"lowImp\", \"\"],\n      daily: [\"Daily rental\", \"Night suffix, Booked chip, Mark as Booked in the row menu.\", \"active\", \"dailyRental\", \"\"],\n      offplan: [\"Off-plan initial sale\", \"Wafi license, TruCheck and services disabled with a reason.\", \"active\", \"offPlan\", \"\"],\n      rankpending: [\"Rank pending\", \"Posted minutes ago: rank arrives within the hour, stats are dashes.\", \"active\", \"rankPending\", \"\"],\n      nodata: [\"Just posted
