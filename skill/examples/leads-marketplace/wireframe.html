.pfp-caption { color: var(--pfp-muted); font-size: 12px; text-align: center; }

.pfp-notes h2 { font-size: 15px; margin: 0; }

.pfp-notes p { margin: 0; }
.pfp-notes ul { margin: 0; padding-inline-start: 18px; }
.pfp-states { display: flex; flex-direction: column; gap: 10px; }
.pfp-states .pfp-sg { display: flex; flex-wrap: wrap; gap: 6px; }
.pfp-states button { min-height: 26px; padding: 3px 8px; font-size: 12px; border-radius: 999px; }
.pfp-states button[aria-pressed="true"] { background: var(--pfp-accent); border-color: var(--pfp-accent); color: #fff; }
.pfp-issues { display: flex; flex-direction: column; gap: 6px; font-size: 12px; }

.pfp-issues li[data-level="warn"] { background: var(--pfp-warn-soft); color: var(--pfp-warn); }
.pfp-issues ul { padding: 0; }
.pfp-muted { color: var(--pfp-muted); }

<script type="text/plain" id="pfp-kitcss">/* Profolio KSA pattern kit (kit/kit.css): the layouts the product does not draw yet, and the
   runtime's own pieces (toasts, skeleton bars, busy buttons).

   Every value is a token, or is measured from a compiled screen and named here. The 2.0
   values come from pages/listings-new*.html (measured 2026-09-30; see kit/README.md), and
   each colour, space and radius var() falls back to the same value, so a pattern draws the same
   with or without css/new-theme/tokens.css. The face is the page's own where the 2.0 fonts are
   not loaded: var(--pf-ml-font-ui, inherit).

   Headers and cells share one grid (--pfk-cols) and one horizontal padding, so a column's
   header sits over its cells by construction. The 2.0 build pads its header and row cells
   differently, and a table copied from it drifts (Leads Marketplace, 2026-09-30: 12 px). */

/* ── the runtime's pieces ──────────────────────────────────────────────── */
.pfk-toasts { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.pfk-toasts > * { pointer-events: auto; animation: pfk-in 200ms ease; }
.pfk-toast { max-width: 520px; padding: 10px 16px; border-radius: var(--pf-ml-radius-md, 8px); background: var(--pf-ml-surface-card, #fff); color: var(--pf-ml-text-primary, #222); box-shadow: var(--pf-ml-elevation-toast, 0 10px 30px rgba(23,26,31,0.22)); font-weight: 500; font-size: 14px; line-height: 20px; font-family: var(--pf-ml-font-ui, inherit); }
.pfk-toast--out, .pfk-toasts > .pfk-toast--out { opacity: 0; transform: translateY(-4px); transition: opacity 200ms ease, transform 200ms ease; }
@keyframes pfk-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.pfk-skel { display: inline-block; vertical-align: middle; height: 12px; width: 96px; max-width: 100%; border-radius: var(--pf-ml-radius-xs, 4px); background: linear-gradient(90deg, #F0F0F0 25%, #F7F7F7 37%, #F0F0F0 63%) 0 0 / 400% 100%; animation: pfk-shimmer 1.4s ease infinite; }
.pfk-skel--block { border-radius: var(--pf-ml-radius-sm, 6px); }
@keyframes pfk-shimmer { from { background-position: 100% 50%; } to { background-position: 0 50%; } }
.pfk-busy { opacity: 0.7; cursor: progress !important; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .pfk-skel { animation: none; } .pfk-toasts > * { animation: none; } }

/* ── table: one grid for the header and every row ─────────────────────── */
.pfk-table { --pfk-cols: 1fr; --pfk-cell-x: 16px; background: var(--pf-ml-surface-card, #fff); border-radius: var(--pf-ml-radius-md, 8px); overflow: hidden; font-family: var(--pf-ml-font-ui, inherit); color: var(--pf-ml-text-primary, #222); }
.pfk-thead, .pfk-tr { display: grid; grid-template-columns: var(--pfk-cols); align-items: center; }
.pfk-thead { background: #F5F5F5; min-height: 42px; }              /* the 2.0 list header row (listings-new) */
.pfk-th { font-weight: 400; font-size: 14px; line-height: 18px; font-family: var(--pf-ml-font-ui, inherit); color: var(--pf-ml-text-primary, #222); padding-block: 12px; }
.pfk-tr { background: var(--pf-ml-surface-card, #fff); border-bottom: 1px solid var(--pf-ml-border-soft, #F0F0F0); padding-block: var(--pf-ml-space-xl, 16px); min-height: 72px; }
.pfk-tr:last-child { border-bottom: 0; }
.pfk-table--roomy .pfk-tr { padding-block: var(--pf-ml-space-section, 24px); }
.pfk-th, .pfk-td { min-width: 0; padding-inline: 0 var(--pfk-cell-x); }
.pfk-th:first-child, .pfk-td:first-child { padding-inline-start: var(--pfk-cell-x); }
.pfk-th--end, .pfk-td--end { justify-self: stretch; text-align: end; display: flex; justify-content: flex-end; }
.pfk-tr--good { background: var(--pf-ml-tint-green-050, #F0FAF5); }
.pfk-tr--muted { opacity: 0.54; }                                  /* the product's disabled dim */
.pfk-tbody-note { padding: var(--pf-ml-space-section, 24px) var(--pfk-cell-x); }

/* ── cell content ──────────────────────────────────────────────────────── */
.pfk-stack { display: flex; flex-direction: column; gap: var(--pf-ml-space-xxs, 2px); min-width: 0; }
.pfk-stack--md { gap: var(--pf-ml-space-xs, 4px); }
.pfk-inline { display: flex; align-items: center; gap: var(--pf-ml-space-sm, 6px); min-width: 0; flex-wrap: wrap; }
.pfk-label { font-weight: 300; font-size: 12px; line-height: normal; font-family: var(--pf-ml-font-ui, inherit); color: var(--pf-ml-type-label-web-color, #4F4F4F); }
.pfk-value { font-weight: 500; font-size: 14px; line-height: 18px; font-family: var(--pf-ml-font-ui, inherit); color: var(--pf-ml-text-primary, #222); }
.pfk-value--strong { font-weight: 700; font-size: 16px; line-height: normal; font-family: var(--pf-ml-font-ui, inherit); }
.pfk-value--hero { font-weight: 700; font-size: 20px; line-height: normal; font-family: var(--pf-ml-font-ui, inherit); }
.pfk-meta { font-weight: 400; font-size: 12px; line-height: 16px; font-family: var(--pf-ml-font-ui, inherit); color: var(--pf-ml-text-muted, #707070); }
.pfk-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pfk-amount { display: inline-flex; align-items: baseline; gap: 0.22em; white-space: nowrap; }
.pfk-amount > svg { height: max(7px, 0.6em); width: auto; flex: none; fill: currentColor; }
.pfk-icon { width: 16px; height: 16px; flex: none; color: var(--pf-ml-text-muted, #707070); }
.pfk-teaser { filter: blur(5px); user-select: none; pointer-events: none; }  /* a placeholder shown blurred — never real data */

/* ── pills: the build's status tags (11px · 600 · radius 4 · 2px 6px) ─── */
.pfk-pill { display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 2px 6px; border-radius: var(--pf-ml-radius-xs, 4px); font-weight: 600; font-size: 11px; line-height: 14px; font-family: var(--pf-ml-font-ui, inherit); white-space: nowrap; }
.pfk-pill--good { color: var(--pf-ml-type-subtype-web-color, #208E57); background: var(--pf-ml-tint-green-100, #E9F7F0); }
.pfk-pill--info { color: #2C6699; background: var(--pf-ml-tint-blue-050, #F0F7FC); }          /* the build's Booked tag */
.pfk-pill--neutral { color: var(--pf-ml-text-tertiary, #626262); background: var(--pf-ml-border-soft, #F0F0F0); }
.pfk-pill--warn { color: var(--pf-ml-status-warn, #C88B37); background: var(--pf-ml-tint-amber-050, #FEF8F0); }
.pfk-pill--bad { color: var(--pf-ml-status-bad, #CE2929); background: var(--pf-ml-tint-red-050, #FFF2F2); }

/* ── buttons: one height in a pattern (40 = target.iconButton) ────────── */
.pfk-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--pf-ml-space-sm, 6px); min-height: 40px; padding: 0 var(--pf-ml-space-xl, 16px); border-radius: var(--pf-ml-radius-sm, 6px); border: 1px solid transparent; font-weight: 500; font-size: 14px; line-height: 18px; font-family: var(--pf-ml-font-ui, inherit); white-space: nowrap; cursor: pointer; background: var(--pf-ml-brand-green, #28B16D); color: var(--pf-ml-text-on-brand, #fff); }
.pfk-btn:hover { background: var(--pf-ml-brand-green-pressed, #208E57); }
.pfk-btn--secondary { background: var(--pf-ml-surface-card, #fff); color: var(--pf-ml-text-primary, #222); border-color: var(--pf-ml-border-strong, #DEDEDE); }
.pfk-btn--secondary:hover { background: var(--pf-ml-surface-card, #fff); border-color: var(--pf-ml-text-faint, #9D9D9D); }
.pfk-btn--soft { background: var(--pf-ml-tint-green-050, #F0FAF5); color: var(--pf-ml-brand-green-ink, #249F62); }
.pfk-btn--soft:hover { background: var(--pf-ml-tint-green-100, #E9F7F0); }
.pfk-btn--link { background: none; border: 0; min-height: 0; padding: 0; color: var(--pf-ml-brand-green-ink, #249F62); }
.pfk-btn--link:hover { background: none; text-decoration: underline; }
.pfk-btn--block { width: 100%; }
.pfk-btn[disabled], .pfk-btn[aria-disabled="true"] { opacity: 0.54; cursor: not-allowed; }  /* the product's disabled dim */
.pfk-btn > svg { width: 16px; height: 16px; flex: none; }

/* ── empty, error and first-use: one block, the build's empty-state type ─ */
.pfk-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--pf-ml-space-md, 8px); padding: 56px var(--pf-ml-space-section, 24px); }
.pfk-empty__art { width: 88px; height: 88px; border-radius: 26px; display: grid; place-items: center; background: #F4F9F6; margin-bottom: var(--pf-ml-space-md, 8px); }   /* the build's empty art (listings-new/empty-*.html) */
.pfk-empty__art--grey { background: #F6F7F8; }                                             /* its offline art */
.pfk-empty__art > svg { width: 42px; height: 42px; }
.pfk-empty__title { font: 700 20px/24px Figtree, sans-serif; color: var(--pf-ml-text-primary, #222); margin: 0; }   /* the build's empty-state title */
.pfk-empty__text { font-weight: 400; font-size: 14px; line-height: 21px; font-family: var(--pf-ml-font-ui, inherit); color: var(--pf-ml-text-muted, #707070); max-width: 400px; margin: 0; }
.pfk-empty__actions { display: flex; gap: var(--pf-ml-space-md, 8px); margin-top: var(--pf-ml-space-md, 8px); }

/* ── a note inside a design: never part of the product ─────────────────── */
.pfk-note { display: block; padding: 8px 12px; border-radius: 6px; background: #FFF7E6; color: #7A4B00; font: 400 12px/16px system-ui, sans-serif; }

/* ── 2.0 controls, as the build draws them (pages/listings-new.html, measured 2026-09-30) ──
   The build writes its styles inline, so its selected look is another style attribute: here
   it is a modifier class, which the runtime toggles (data-pf-class). */
/* segmented (tpl 87–90): white, 44 px, an outline; the selected option tinted green */
.pfk-seg { display: inline-flex; align-items: center; height: 44px; padding: 6px 5px; background: var(--pf-ml-surface-card, #fff); border-radius: var(--pf-ml-radius-md, 8px); outline: 1px solid var(--pf-ml-border-soft, #F0F0F0); outline-offset: -1px; }
.pfk-seg__opt { padding: 8px 12px; border: 0; background: none; border-radius: var(--pf-ml-radius-sm, 6px); color: var(--pf-ml-text-muted, #707070); font-size: 14px; font-weight: 400; line-height: 19px; font-family: var(--pf-ml-font-ui, inherit); cursor: pointer; white-space: nowrap; }
.pfk-seg__opt--on { padding: 8px 20px; background: var(--pf-ml-tint-green-050, #F0FAF5); color: var(--pf-ml-brand-green-ink, #249F62); font-weight: 600; }
/* select field (tpl 109): 44 px, an inset hairline, a chevron */
.pfk-select { display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 44px; min-width: 200px; padding: 0 12px; background: var(--pf-ml-surface-card, #fff); box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.18); border: 0; border-radius: var(--pf-ml-radius-sm, 6px); color: var(--pf-ml-text-faint, #9D9D9D); font-size: 14px; font-weight: 400; font-family: var(--pf-ml-font-ui, inherit); cursor: pointer; text-align: start; }
.pfk-select--set { color: var(--pf-ml-text-primary, #222); }
.pfk-select__label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pfk-select__chevron { width: 16px; height: 16px; flex: none; color: var(--pf-ml-text-secondary, #4F4F4F); }
.pfk-anchor { position: relative; display: inline-flex; }
/* applied filters (tpl 182–184): 32 px pills, an outline, the name light */
.pfk-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.pfk-chip { display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 12px 0 16px; background: var(--pf-ml-surface-card, #fff); border: 0; border-radius: var(--pf-ml-radius-pill, 999px); outline: 1px solid var(--pf-ml-border-base, #E6E6E6); outline-offset: -1px; font-size: 14px; font-family: var(--pf-ml-font-ui, inherit); color: var(--pf-ml-text-primary, #222); cursor: pointer; }
.pfk-chip__name { color: var(--pf-ml-text-muted, #707070); font-weight: 300; }
.pfk-chip__x { width: 14px; height: 14px; color: var(--pf-ml-text-muted, #707070); }
.pfk-clear { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: 0; background: none; border-radius: var(--pf-ml-radius-sm, 6px); color: #F73131; font-size: 14px; font-weight: 500; font-family: var(--pf-ml-font-ui, inherit); cursor: pointer; }  /* the build's Clear All */
/* outlined control (tpl 206: Newest First) */
.pfk-outline { display: inline-flex; align-items: center; gap: 5px; padding: 8px 16px; border: 0; background: var(--pf-ml-surface-card, #fff); border-radius: var(--pf-ml-radius-sm, 6px); outline: 1px solid var(--pf-ml-border-base, #E6E6E6); outline-offset: -1px; color: var(--pf-ml-brand-green-ink, #249F62); font-size: 14px; font-weight: 500; font-family: var(--pf-ml-font-ui, inherit); cursor: pointer; white-space: nowrap; }
.pfk-outline > svg { width: 15px; height: 15px; flex: none; }
/* tabs (tpl 195–199): 40 px, a count pill, a 3 px ink under the selected one */
.pfk-tabs { display: flex; align-items: center; gap: 7px; }
.pfk-tab { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 12px; border: 0; background: none; cursor: pointer; color: var(--pf-ml-text-muted, #707070); font-size: 14px; font-weight: 500; font-family: var(--pf-ml-font-ui, inherit); white-space: nowrap; }
.pfk-tab__count { padding: 0 8px; border-radius: 100px; background: #F5F5F5; color: var(--pf-ml-text-muted, #707070); font-size: 12px; font-weight: 400; }
.pfk-tab--on { color: var(--pf-ml-brand-green-ink, #249F62); font-weight: 600; }
.pfk-tab--on .pfk-tab__count { background: var(--pf-ml-tint-green-100, #E9F7F0); color: var(--pf-ml-brand-green-ink, #249F62); }
.pfk-tab--on::after { content: ""; position: absolute; left: 0; bottom: -11px; width: 100%; height: 3px; background: var(--pf-ml-brand-green-ink, #249F62); }
/* a dropdown menu under a field */
.pfk-menu { position: absolute; top: calc(100% + 6px); inset-inline-start: 0; z-index: 30; min-width: 100%; max-height: 320px; overflow: auto; padding: 6px; background: var(--pf-ml-surface-card, #fff); border-radius: var(--pf-ml-radius-md, 8px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 8px 20px 0 rgba(0, 0, 0, 0.06); }
.pfk-menu--end { inset-inline-start: auto; inset-inline-end: 0; }
.pfk-menu__item { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 40px; padding: 0 12px; border: 0; background: none; border-radius: var(--pf-ml-radius-sm, 6px); color: var(--pf-ml-text-primary, #222); font-size: 14px; font-weight: 400; font-family: var(--pf-ml-font-ui, inherit); text-align: start; white-space: nowrap; cursor: pointer; }
.pfk-menu__item:hover { background: #F5F5F5; }
.pfk-menu__item--on { color: var(--pf-ml-brand-green-ink, #249F62); font-weight: 600; background: var(--pf-ml-tint-green-050, #F0FAF5); }
/* dialog (listings-new/modal-request-services.html, tpl 2121–2203) */
.pfk-mask { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--pf-ml-surface-scrim, rgba(23, 26, 31, 0.42)); }
.pfk-dialog { width: 520px; max-width: 100%; max-height: 100%; display: flex; flex-direction: column; overflow: hidden; background: var(--pf-ml-surface-card, #fff); border-radius: var(--pf-ml-radius-lg, 12px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 8px 20px 0 rgba(0, 0, 0, 0.06), 0 16px 40px 8px rgba(0, 0, 0, 0.04); font-family: var(--pf-ml-font-ui, inherit); }
.pfk-dialog__head { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--pf-ml-border-soft, #F0F0F0); }
.pfk-dialog__title { margin: 0; font: 600 15px/22px Figtree, sans-serif; color: var(--pf-ml-text-primary, #222); }
.pfk-dialog__close { display: grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 0; background: none; border-radius: var(--pf-ml-radius-xs, 4px); color: var(--pf-ml-text-muted, #707070); cursor: pointer; }
.pfk-dialog__close > svg { width: 16px; height: 16px; }
.pfk-dialog__body { display: flex; flex-direction: column; gap: 20px; padding: 20px 24px; overflow: auto; }
.pfk-dialog__foot { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--pf-ml-border-soft, #F0F0F0); }
.pfk-dialog__note { margin: 0; font: 400 12px/14px Figtree, sans-serif; color: var(--pf-ml-text-faint, #9D9D9D); }
.pfk-dialog .pfk-btn { min-height: 37px; padding: 8px 24px; border-radius: var(--pf-ml-radius-md, 8px); font: 600 14px/21px Figtree, sans-serif; }
.pfk-dialog .pfk-btn--secondary { padding: 8px 20px; border: 0; outline: 1px solid var(--pf-ml-border-base, #E6E6E6); outline-offset: -1px; color: var(--pf-ml-text-muted, #707070); font-weight: 500; }
.pfk-summary { display: flex; flex-direction: column; gap: 6px; padding: 12px 16px; border-radius: var(--pf-ml-radius-md, 8px); background: #F9F9F9; outline: 1px solid var(--pf-ml-border-soft, #F0F0F0); outline-offset: -1px; }
.pfk-kv { display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: 14px; color: var(--pf-ml-text-secondary, #4F4F4F); }
.pfk-kv > b { color: var(--pf-ml-text-primary, #222); font-weight: 600; }
.pfk-callout { display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; border-radius: var(--pf-ml-radius-md, 8px); background: var(--pf-ml-tint-green-050, #F0FAF5); color: var(--pf-ml-text-secondary, #4F4F4F); font-size: 14px; line-height: 20px; }
.pfk-callout--warn { background: var(--pf-ml-tint-amber-050, #FEF8F0); }
/* a card on the page (the build's list card: white, radius 8) */
.pfk-card { background: var(--pf-ml-surface-card, #fff); border-radius: var(--pf-ml-radius-md, 8px); }
.pfk-card--pad { padding: 16px; }
.pfk-row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.pfk-between { justify-content: space-between; }
.pfk-grow { flex: 1; min-width: 0; }

/* ── 2.0 on a phone (pages/listings-new.mobile.html, 360 wide; measured 2026-09-30) ──────── */
.pfk-strip { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding: 0 16px; scrollbar-width: none; }
.pfk-strip::-webkit-scrollbar { display: none; }
.pfk-seg--sm { height: 32px; padding: 0 4px; gap: 2px; border-radius: 46px; flex: none; }
.pfk-seg--sm .pfk-seg__opt { padding: 4px 5px; font-size: 12px; line-height: normal; border-radius: 26px; }
.pfk-seg--sm .pfk-seg__opt--on { padding: 4px 8px; }
.pfk-fchip { flex: none; display: inline-flex; align-items: center; gap: 4px; max-width: 148px; height: 32px; padding: 0 10px; background: var(--pf-ml-surface-card, #fff); border: 0; border-radius: 46px; outline: 1px solid var(--pf-ml-border-soft, #F0F0F0); outline-offset: -1px; color: var(--pf-ml-text-muted, #707070); font-size: 12px; font-weight: 400; font-family: var(--pf-ml-font-ui, inherit); cursor: pointer; white-space: nowrap; }
.pfk-fchip--set { color: var(--pf-ml-brand-green-ink, #249F62); background: var(--pf-ml-tint-green-050, #F0FAF5); outline-color: var(--pf-ml-tint-green-200, #D4EFE2); font-weight: 600; }
.pfk-fchip > svg { width: 12px; height: 12px; flex: none; }
.pfk-tabs--sm { gap: 0; padding: 0 8px; overflow-x: auto; border-bottom: 1px solid var(--pf-ml-border-soft, #F0F0F0); scrollbar-width: none; }
.pfk-tabs--sm .pfk-tab { height: auto; padding: 9px 8px; gap: 4px; font-size: 12px; }
.pfk-tabs--sm .pfk-tab--on { color: var(--pf-ml-brand-green-deep, #10603A); }
.pfk-tabs--sm .pfk-tab__count { padding: 0 6px; font-size: 10px; }
.pfk-tabs--sm .pfk-tab--on .pfk-tab__count { color: var(--pf-ml-brand-green-deep, #10603A); }
.pfk-tabs--sm .pfk-tab--on::after { bottom: -1px; }
.pfk-list { display: flex; flex-direction: column; gap: 12px; padding: 12px 16px 24px; }
.pfk-lead { display: flex; flex-direction: column; gap: 10px; padding: 12px; background: var(--pf-ml-surface-card, #fff); border-radius: var(--pf-ml-radius-lg, 12px); outline: 1px solid var(--pf-ml-border-soft, #F0F0F0); outline-offset: -1px; }
.pfk-lead--good { background: var(--pf-ml-tint-green-050, #F0FAF5); outline-color: var(--pf-ml-tint-green-200, #D4EFE2); }
.pfk-lead--muted { opacity: 0.54; }
.pfk-sheet { position: fixed; inset: auto 0 0 0; z-index: 1001; display: flex; flex-direction: column; gap: 16px; max-height: calc(100% - 48px); overflow: auto; padding: 20px 16px 24px; background: var(--pf-ml-surface-sheet, #fff); border-radius: var(--pf-ml-radius-sheet, 20px) var(--pf-ml-radius-sheet, 20px) 0 0; box-shadow: 0 -10px 40px rgba(23, 26, 31, 0.2); font-family: var(--pf-ml-font-ui, inherit); }
.pfk-sheet__handle { position: absolute; top: 8px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 20px; background: var(--pf-ml-border-strong, #DEDEDE); }
.pfk-sheet__title { margin: 0; font: 700 17px/24px Figtree, sans-serif; color: var(--pf-ml-text-primary, #222); }
.pfk-sheet .pfk-menu__item { min-height: 44px; padding: 0 4px; font-size: 14px; }
.pfk-sheet .pfk-btn { min-height: 44px; }
.pfk-mask--sheet { align-items: flex-end; padding: 0; }
.pfk-bar { padding: 12px 16px 0; }

<script>/* The prototype player (kit/player.js). It is the page qa/prototype.mjs writes around a
   design: one file holding every screen, state, stylesheet and product page the prototype
   opens. A screen runs in its own frame at its real size (1440 × 900 on the web, 375 × 812
   on a phone) with kit/runtime.js inside it. The player:
     - lists the states;
     - switches between web and phone (M);
     - holds the scenario controls;
     - shows each state's notes and the QA result.
   A headless run (qa/prototype.mjs) drives it through window.__pfp. */
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var M = JSON.parse($('pfp-manifest').textContent);
  var RUNTIME = $('pfp-runtime').textContent;
  var QA = $('pfp-qa').textContent;
  var KITCSS = $('pfp-kitcss').textContent;
  var blobs = {};
  Array.prototype.forEach.call(document.querySelectorAll('script[data-path]'), function (s) { blobs[s.getAttribute('data-path')] = s; });
  var cache = {};
  var SIZE = { web: [1440, 900], phone: [375, 812] };

  /* ── files: gzip + base64 in the page, text when asked for ───────────── */
  function file(path) {
    if (cache[path]) return cache[path];
    var s = blobs[path];
    if (!s) return Promise.resolve(null);
    var b64 = s.textContent.trim(), bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var p;
    if (s.type === 'application/gzip-base64') {
      if (!window.DecompressionStream) return Promise.reject(new Error('This browser cannot open the prototype (no DecompressionStream) — use a current Chrome, Safari or Firefox'));
      p = new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    } else p = Promise.resolve(new TextDecoder().decode(bytes));
    cache[path] = p;
    return p;
  }
  function frameHtml(path, boot) {
    return file(path).then(function (html) {
      if (html == null) throw new Error(path + ' is not in this prototype');
      var links = [], re = /<link data-pf-css="([^"]+)"[^>]*>/g, m;
      while ((m = re.exec(html))) links.push(m[1]);
      return Promise.all(links.map(file)).then(function (css) {
        var byPath = {};
        links.forEach(function (p, i) { byPath[p] = css[i] || ''; });
        html = html.replace(/<link data-pf-css="([^"]+)"[^>]*>/g, function (all, p) { return '<style data-pf-css="' + p + '">' + byPath[p] + '</style>'; });
        var inject = '<style data-pf-kit>' + KITCSS + '</style>' +
          '<script>window.PF_BOOT=' + JSON.stringify(boot).replace(/</g, '\\u003c') + '<\/script>' +
          '<script>' + RUNTIME + '<\/script><script>' + QA + '<\/script>';
        var at = html.search(/<\/body>\s*(<\/html>\s*)?$/i);
        return at > -1 ? html.slice(0, at) + inject + html.slice(at) : html + inject;
      });
    });
  }

  /* ── the page ────────────────────────────────────────────────────────── */
  var root = $('pfp');
  var frame = $('pfp-frame'), device = $('pfp-device');
  var cur = { entry: null, platform: (M.platforms && M.platforms[0]) || 'web', state: null, ready: false };
  var overrides = {}, snapshot = {}, waiters = [], qaWait = {}, frameErrors = [];

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { if (k === 'text') e.textContent = attrs[k]; else if (k === 'on') Object.keys(attrs.on).forEach(function (ev) { e.addEventListener(ev, attrs.on[ev]); }); else e.setAttribute(k, attrs[k]); });
    (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }
  function toast(msg) {
    var t = el('div', { class: 'pfp-toast', role: 'status', text: msg });
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2600);
  }
  function sizeOf(entry, platform) { return (entry && entry.size && entry.size[platform]) || SIZE[platform] || SIZE.web; }
  function fit() {
    var s = sizeOf(cur.entry, cur.platform);
    frame.style.width = s[0] + 'px'; frame.style.height = s[1] + 'px';
    var shot = root.getAttribute('data-mode') === 'shot';
    var avail = Math.max(320, $('pfp-stage').clientWidth - 32);
    var k = shot ? 1 : Math.min(1, avail / s[0]);
    if (cur.platform === 'phone' && !shot) k = Math.min(1, Math.max(0.5, (window.innerHeight - 140) / s[1]));
    frame.style.transform = k === 1 ? 'none' : 'scale(' + k + ')';
    device.style.width = Math.round(s[0] * k) + 'px'; device.style.height = Math.round(s[1] * k) + 'px';
    device.setAttribute('data-platform', cur.platform);
    $('pfp-caption').textContent = (cur.entry ? (cur.entry.title || cur.entry.id) + ' · ' : '') + (cur.platform === 'phone' ? 'Phone' : 'Web') + ' · ' + s[0] + ' × ' + s[1] + (k < 1 ? ' · shown at ' + Math.round(k * 100) + '%' : '');
  }
  window.addEventListener('resize', fit);

  function find(to) {
    to = String(to || '');
    var s = M.screens.filter(function (x) { return x.id === to || x.route === to; })[0];
    if (s) return s;
    var pages = M.pages || {};
    if (pages[to]) return pages[to];
    return Object.keys(pages).map(function (k) { return pages[k]; }).filter(function (p) { return p.route === to || p.route === to.replace(/\/$/, ''); })[0] || null;
  }
  function load(entry, state, carry) {
    var path = entry.files[cur.platform] || entry.files.web || entry.files.phone;
    if (!entry.files[cur.platform]) toast('No ' + cur.platform + ' layout for ' + (entry.title || entry.id) + ' — showing ' + (entry.files.web ? 'web' : 'phone'));
    cur.entry = entry; cur.ready = false; frameErrors = [];
    var boot = { screen: entry.id, file: path, platform: cur.platform, state: state || null, carry: carry || null, menu: M.menu || {}, labels: M.labels || {} };
    fit();
    return frameHtml(path, boot).then(function (html) { frame.srcdoc = html; }, function (e) { toast(e.message); });
  }
  function whenReady() { return new Promise(function (r) { if (cur.ready) r(); else waiters.push(r); }); }
  function send(msg) { try { frame.contentWindow.postMessage(msg, '*'); } catch (e) { /* not loaded */ } }

  function stateById(id) { return M.states.filter(function (s) { return s.id === id; })[0]; }
  function payload(st) {
    var set = {};
    Object.keys(overrides).forEach(function (k) { set[k] = overrides[k]; });
    Object.keys(st.set || {}).forEach(function (k) { set[k] = st.set[k]; });
    return { set: set, do: st.do || [] };
  }
  var applied = {};
  function go(id) {
    var st = stateById(id);
    if (!st) { toast('No state "' + id + '"'); return Promise.resolve(); }
    cur.state = id;
    var entry = find(st.screen) || M.screens[0];
    notes();
    if (!cur.entry || cur.entry.id !== entry.id || !cur.ready) {
      return load(entry, payload(st)).then(whenReady);
    }
    return new Promise(function (r) {
      var key = Math.random().toString(36).slice(2);
      applied[key] = r;
      send({ pf: 'apply', state: payload(st), id: key });
      setTimeout(function () { if (applied[key]) { delete applied[key]; r(); } }, 5000);
    });
  }
  function setPlatform(p) {
    if (p === cur.platform || !SIZE[p]) return Promise.resolve();
    cur.platform = p;
    Array.prototype.forEach.call(document.querySelectorAll('[data-platform-btn]'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-platform-btn') === p)); });
    if (cur.state) { var st = stateById(cur.state); return load(find(st.screen) || M.screens[0], payload(st)).then(whenReady); }
    return load(cur.entry || M.screens[0], null, snapshot).then(whenReady);
  }

  window.addEventListener('message', function (ev) {
    var m = ev.data;
    if (!m || !m.pf || ev.source !== frame.contentWindow) return;
    if (m.pf === 'ready') { cur.ready = true; snapshot = m.state || {}; syncControls(); var w = waiters; waiters = []; w.forEach(function (f) { f(); }); }
    else if (m.pf === 'applied') { snapshot = m.state || {}; syncControls(); if (applied[m.id]) { applied[m.id](); delete applied[m.id]; } }
    else if (m.pf === 'state') { snapshot = m.state || {}; syncControls(); }
    else if (m.pf === 'error') { frameErrors.push(m.message); }
    else if (m.pf === 'go') { go(m.state); }
    else if (m.pf === 'platform') { setPlatform(cur.platform === 'web' ? 'phone' : 'web'); }
    else if (m.pf === 'page') {
      var t = find(m.to);
      if (!t) { toast('“' + m.to + '” is not part of this prototype'); return; }
      cur.state = null; notes();
      load(t, null, m.state || snapshot);
    } else if (m.pf === 'file') {
      var path = resolve(m.path, m.from);
      (path ? file(path) : Promise.resolve(null)).then(function (html) {
        send({ pf: 'file', id: m.id, html: html || '' });
      });
    } else if (m.pf === 'qa') { if (qaWait[m.id]) { qaWait[m.id](m.result); delete qaWait[m.id]; } }
  });
  /* a compiled state a click names (data-pf-go): the bundler's alias, the same folder, or
     the same state of another page — the shell's states are the same on every page */
  function resolve(target, from) {
    var alias = (M.alias || {})[target];
    if (alias && blobs[alias]) return alias;
    var dir = String(from || '').replace(/[^/]*$/, '');
    var parts = (dir + target).split('/'), out = [];
    parts.forEach(function (p) { if (p === '..') out.pop(); else if (p && p !== '.') out.push(p); });
    var joined = out.join('/');
    if (blobs[joined]) return joined;
    var name = target.split('/').pop().replace(/^[\w-]+--/, '');
    var phone = /\.mobile\.html$/.test(name) || cur.platform === 'phone';
    var base = name.replace(/(\.mobile)?\.html$/, '');
    var hit = Object.keys(blobs).filter(function (k) { return /^pages\/[^/]+\//.test(k) && k.split('/').pop().replace(/(\.mobile)?\.html$/, '') === base && /\.mobile\.html$/.test(k) === phone; })[0];
    return hit || null;
  }

  /* ── the controls ────────────────────────────────────────────────────── */
  function build() {
    var bar = $('pfp-bar');
    var title = el('div', { class: 'pfp-title' }, [el('b', { text: M.title || M.name || 'Prototype' }), el('span', { text: (M.wireframe ? 'Wireframe — structure and flow, not visuals' : 'Prototype') + ' · Profolio KSA' + (M.theme ? ' · ' + M.theme : '') })]);
    bar.appendChild(title);
    if (M.screens.length > 1) {
      var sel = el('select', { 'aria-label': 'Screen', on: { change: function () { var s = find(this.value); cur.state = null; notes(); load(s, null, snapshot); } } });
      M.screens.forEach(function (s) { sel.appendChild(el('option', { value: s.id, text: s.title || s.id })); });
      bar.appendChild(el('div', { class: 'pfp-group' }, [el('label', { text: 'Screen' }), sel]));
    }
    if ((M.platforms || []).length > 1) {
      var seg = el('div', { class: 'pfp-seg', role: 'group', 'aria-label': 'Layout' });
      M.platforms.forEach(function (p) { seg.appendChild(el('button', { type: 'button', 'data-platform-btn': p, 'aria-pressed': String(p === cur.platform), text: p === 'phone' ? 'Phone' : 'Web', on: { click: function () { setPlatform(p); } } })); });
      bar.appendChild(el('div', { class: 'pfp-group' }, [seg]));
    }
    (M.controls || []).forEach(function (c) {
      var sel = el('select', { 'data-control': c.key, 'aria-label': c.label, on: { change: function () { var v = c.options[this.selectedIndex][0]; overrides[c.key] = v; send({ pf: 'set', key: c.key, value: v }); } } });
      c.options.forEach(function (o, i) { sel.appendChild(el('option', { value: String(i), text: o[1] })); });
      bar.appendChild(el('div', { class: 'pfp-group' }, [el('label', { text: c.label }), sel]));
    });
    bar.appendChild(el('button', { type: 'button', text: 'Restart', on: { click: function () { overrides = {}; go(M.start || M.states[0].id); } } }));
    var q = M.qa || {};
    var qaBtn = el('button', { type: 'button', class: 'pfp-qa', 'data-state': !q.ran ? 'warn' : q.errors ? 'fail' : 'pass', text: !q.ran ? 'QA not run' : q.errors ? 'QA: ' + q.errors + ' issue' + (q.errors > 1 ? 's' : '') : 'QA passed', on: { click: function () { runQA(); } } });
    bar.appendChild(qaBtn);
    if (q.ran && q.errors) root.insertBefore(el('div', { class: 'pfp-banner', text: 'Design QA found ' + q.errors + ' issue' + (q.errors > 1 ? 's' : '') + ' — this prototype is not ready to share. Open QA for the list.' }), $('pfp-main'));
    else if (!q.ran && !M.wireframe) root.insertBefore(el('div', { class: 'pfp-banner', 'data-kind': 'warn', text: 'Visual QA did not run where this was built' + (q.note ? ' (' + q.note + ')' : '') + ' — press QA to check it in this browser.' }), $('pfp-main'));
    var groups = {};
    M.states.forEach(function (s) { var g = s.group || 'States'; (groups[g] = groups[g] || []).push(s); });
    var box = $('pfp-states');
    Object.keys(groups).forEach(function (g) {
      var row = el('div', { class: 'pfp-sg' });
      groups[g].forEach(function (s) { row.appendChild(el('button', { type: 'button', 'data-state-btn': s.id, 'aria-pressed': 'false', text: s.title || s.id, on: { click: function () { go(s.id); } } })); });
      box.appendChild(el('div', {}, [el('h3', { text: g }), row]));
    });
  }
  function syncControls() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-control]'), function (sel) {
      var c = (M.controls || []).filter(function (x) { return x.key === sel.getAttribute('data-control'); })[0];
      var v = snapshot[c.key], i = c.options.map(function (o) { return String(o[0]); }).indexOf(String(v));
      if (i > -1 && sel.selectedIndex !== i) sel.selectedIndex = i;
    });
  }
  function notes() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-state-btn]'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-state-btn') === cur.state)); });
    var st = cur.state && stateById(cur.state), box = $('pfp-note');
    box.textContent = '';
    if (!st) { box.appendChild(el('p', { class: 'pfp-muted', text: 'Browsing freely — pick a state to jump to it.' })); return; }
    box.appendChild(el('h2', { text: st.title || st.id }));
    if (st.notes) box.appendChild(el('p', { text: st.notes }));
    if (st.try && st.try.length) box.appendChild(el('div', {}, [el('h3', { text: 'Try' }), el('ul', {}, st.try.map(function (t) { return el('li', { text: t }); }))]));
  }

  /* ── QA, in this browser ─────────────────────────────────────────────── */
  function qa(opts) {
    return whenReady().then(function () {
      return new Promise(function (r) {
        var id = Math.random().toString(36).slice(2);
        qaWait[id] = function (res) { res.frameErrors = frameErrors.slice(); r(res); };
        send({ pf: 'qa', id: id, options: opts || {}, delay: 120 });
        setTimeout(function () { if (qaWait[id]) { delete qaWait[id]; r({ issues: [{ level: 'error', check: 'qa', message: 'QA did not answer in this frame' }] }); } }, 15000);
      });
    });
  }
  function runQA() {
    qa({ draw: true }).then(function (res) {
      var box = $('pfp-issues');
      box.textContent = '';
      var list = (res.issues || []);
      box.appendChild(el('h3', { text: 'QA · this state · ' + cur.platform }));
      if (!list.length) box.appendChild(el('p', { class: 'pfp-muted', text: 'No issues in this state.' }));
      else box.appendChild(el('ul', {}, list.map(function (i) { return el('li', { 'data-level': i.level, text: (i.level === 'warn' ? 'Warning · ' : '') + i.message }); })));
      (M.qa && M.qa.issues || []).length && box.appendChild(el('p', { class: 'pfp-muted', text: 'At build: ' + M.qa.errors + ' error(s), ' + M.qa.warnings + ' warning(s) across all states.' }));
    });
  }

  window.__pfp = {
    manifest: M,
    size: function () { return sizeOf(cur.entry, cur.platform); },
    go: function (id, platform) { return (platform ? setPlatform(platform) : Promise.resolve()).then(function () { return go(id); }).then(function () { return new Promise(function (r) { setTimeout(r, 250); }); }); },
    qa: qa,
    shot: function (on) { root.setAttribute('data-mode', on ? 'shot' : ''); fit(); },
    state: function () { return snapshot; },
    errors: function () { return frameErrors.slice(); },
  };

  build();
  if (/[#&?]shot\b/.test(location.href)) root.setAttribute('data-mode', 'shot');
  fit();
  go(M.start || (M.states[0] && M.states[0].id));
})();
</script>
</body>
</html>
