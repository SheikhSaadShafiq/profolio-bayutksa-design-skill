<!-- title: Table -->
<!-- about: pfk-table: the header and every row share one grid (--pfk-cols), so a header sits over its column by construction. Cells: pfk-value, pfk-amount with the riyal, pfk-pill, pfk-btn. -->
<div class="pfk-table" style="--pfk-cols: minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) 200px; max-width: 1100px">
  <div class="pfk-thead"><div class="pfk-th">Contact</div><div class="pfk-th">Price</div><div class="pfk-th">Location</div><div class="pfk-th pfk-th--end">Actions</div></div>
  <div class="pfk-tr"><div class="pfk-td"><span class="pfk-value">Abdullah Saleh</span></div><div class="pfk-td"><span class="pfk-amount pfk-value--strong"><i class="pfk-riyal" aria-label="SAR"></i><span>1,200,000</span></span></div><div class="pfk-td"><span class="pfk-value">Al Malqa, Riyadh</span></div><div class="pfk-td pfk-td--end"><button class="pfk-btn"><span>Buy for 40 Credits</span></button></div></div>
  <div class="pfk-tr"><div class="pfk-td"><span class="pfk-value">Nourah Al-Qahtani</span></div><div class="pfk-td"><span class="pfk-amount pfk-value--strong"><i class="pfk-riyal" aria-label="SAR"></i><span>85,000</span></span></div><div class="pfk-td"><span class="pfk-value">Al Olaya, Riyadh</span> <span class="pfk-pill pfk-pill--good">Live</span></div><div class="pfk-td pfk-td--end"><button class="pfk-btn pfk-btn--soft"><span>View in TruLeads →</span></button></div></div>
  <div class="pfk-tr"><div class="pfk-td"><span class="pfk-value">Khalid Al-Shammari</span></div><div class="pfk-td"><span class="pfk-missing">Not shared</span></div><div class="pfk-td"><span class="pfk-value">Al Wurud, Riyadh</span></div><div class="pfk-td pfk-td--end"><button class="pfk-btn pfk-btn--secondary"><span>Buy for 20 Credits</span></button></div></div>
</div>
