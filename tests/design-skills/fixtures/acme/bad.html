<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Orders — a QA fixture with known defects</title>
<style>
:root { --ink: #111827; --muted: #6B7280; --faint: #C7CBD1; --brand: #5B21B6; }
body { margin: 0; font: 14px/20px system-ui, sans-serif; color: var(--ink); }
.page { padding: 24px; }
.bar { display: flex; gap: 12px; align-items: center; height: 40px; overflow: hidden; }
.menu { position: absolute; top: 34px; left: 0; width: 180px; background: #fff; border: 1px solid #ddd; display: none; }
.menu.open { display: block; } .menu button { display: block; width: 100%; height: 36px; border: 0; background: none; text-align: left; padding: 0 12px; }
.anchor { position: relative; }
.btn { background: var(--brand); color: #fff; border: 0; border-radius: 6px; height: 36px; padding: 0 14px; cursor: pointer; outline: none; }
.btn.tiny { height: 18px; font-size: 14px; }
.grid { display: grid; grid-template-columns: 240px 160px 160px 160px; }
.head > div { padding: 12px 0 12px 28px; font-weight: 600; }
.row > div { padding: 12px 0 12px 16px; }
.faint { color: var(--faint); }
.star { animation: wobble 2s infinite; display: inline-block; }
@keyframes wobble { from { transform: rotate(0); } to { transform: rotate(10deg); } }
</style></head>
<body><div class="page">
  <div class="bar"><span class="anchor"><button class="btn" aria-haspopup="menu" aria-expanded="false" onclick="this.nextElementSibling.classList.toggle('open')">Sort</button>
    <div class="menu" role="menu"><button role="menuitem">Newest first</button><button role="menuitem">Oldest first</button><button role="menuitem">Highest total</button></div></span>
    <span class="faint">Last synced 2 minutes ago</span><span class="star">★</span></div>
  <div class="grid head"><div>Customer</div><div>Total</div><div>Status</div><div>Action</div></div>
  <div class="grid row"><div>Maha Al-Rashid</div><div>1,250</div><div>Paid</div><div><button class="btn">View order</button></div></div>
  <div class="grid row"><div>Omar Haddad</div><div>980</div><div>Pending</div><div><button class="btn tiny">View order</button></div></div>
  <div class="grid row"><div>Lina Saleh</div><div>3,400</div><div>Paid</div><div><button class="btn">View order</button></div></div>
</div></body></html>
