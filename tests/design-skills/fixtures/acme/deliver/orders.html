<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Orders — a clean QA fixture</title>
<style>
:root { --ink: #111827; --muted: #4B5563; --brand: #5B21B6; }
body { margin: 0; font: 14px/20px system-ui, sans-serif; color: var(--ink); }
.page { padding: 24px; max-width: 960px; }
.btn { background: var(--brand); color: #fff; border: 0; border-radius: 6px; height: 36px; padding: 0 14px; cursor: pointer; }
.btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) 140px; }
.grid > div { padding: 12px 16px; overflow-wrap: anywhere; min-width: 0; }
.muted { color: var(--muted); }
details { margin: 16px 0; } summary { cursor: pointer; min-height: 24px; }
@media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
</style></head>
<body><div class="page">
  <div data-state="default">
  <p class="muted">Last synced 2 minutes ago</p>
  <details><summary>Filters</summary><p>Status: any</p></details>
  <div class="grid head"><div>Customer</div><div>Total</div><div>Status</div><div>Action</div></div>
  <div class="grid row"><div>Maha Al-Rashid</div><div>1,250</div><div>Paid</div><div><button class="btn">View</button></div></div>
  <div class="grid row"><div>Omar Haddad</div><div>980</div><div>Pending</div><div><button class="btn">View</button></div></div>
  <div class="grid row"><div>Lina Saleh</div><div>3,400</div><div>Paid</div><div><button class="btn">View</button></div></div>
</div>
  <div data-state="empty" hidden><p>No orders yet. Orders appear here when customers check out.</p></div>
</div></body></html>
