# The skill package, held to the system on every push and pull request:
# skill/qa/validate.py — classes, colours, style attributes, registry files,
# states and stylesheet coverage. Only skill/ is checked out.
name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: skill
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: validate.py
        working-directory: skill
        run: python3 qa/validate.py

  # the look: every file in the skill draws Profolio 2.0 (no teal, no Figtree or Lato)
  look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            skill
            scripts/look
            data/look
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: the skill draws the Profolio 2.0 look only (no teal, no Figtree or Lato)
        run: npm install --no-save --no-package-lock chroma-js@3.2.0 && node scripts/look/apply.mjs --check

  # the kit: the Design QA sees every defect it was built for, the worked example's prototype
  # works when used, and its QA passes — in a real headless Chromium
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            skill
            tests
            storybook
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Playwright's Chromium
        run: npm install -g playwright@1.63.0 && playwright install --with-deps chromium
      - name: the Design QA catches what it must
        run: node tests/kit/qa-catches.mjs
      - name: the QA opens every menu and sees one cut off
        run: node tests/kit/sweep-catches.mjs
      - name: the rail is the product's, and shell.rail adds to a group
        run: node tests/kit/rail-catches.mjs
      - name: gate 1 holds three researched directions, and each rule catches its break
        run: node tests/kit/directions-catches.mjs
      - name: the retro runs on a locked design only, and each rule catches its break
        run: node tests/kit/retro-catches.mjs
      - name: the components Storybook builds (main, with any proposed components)
        working-directory: storybook
        run: npm ci --no-audit --no-fund && node gen.mjs && npx storybook build -o /tmp/sb --quiet
      - name: the prototype works
        run: node tests/kit/runtime.mjs
      - name: the composer makes screens the QA accepts
        run: node tests/kit/compose.mjs
      - name: the runtime's smaller pieces work
        run: node tests/kit/runtime-pieces.mjs
      - name: the worked example passes its QA
        working-directory: skill
        run: node qa/prototype.mjs examples/leads-marketplace --no-install

  design-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Playwright's Chromium
        run: npm install -g playwright@1.63.0 && playwright install --with-deps chromium
      - name: every design-* skill passes the build's checks and claude.ai's upload checks
        run: node scripts/design-skills.mjs --check
      - name: the .skill passes claude.ai's upload checks
        run: node scripts/skill-file.mjs --check
      - name: the upload checks refuse what claude.ai refuses
        run: node tests/skill-upload.mjs
      - name: the design-* skills work on a product that is not Profolio
        run: node tests/design-skills/run.mjs
